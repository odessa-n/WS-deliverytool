<script>
  var state = {
    bootstrap: null,
    clients: [],
    activeModule: 'dashboard',
    workingClient: null,
    trustOpsResult: null,
    toFx: {
      frameworks: [],     // [{id, name}] loaded from Vanta for the selected client
      loaded: false,      // true once frameworks have been fetched for current client
      loading: false,     // true while fetching
      storedNames: ''     // names from ClientDB prefill, used to auto-check on load
    }
  };

  var EXEC_LOG_MAX = 80;
  var executionLog = [];

  function appendExecutionLog(operation, success, message) {
    var kind = success === true ? 'success' : (success === false ? 'error' : 'info');
    executionLog.unshift({
      time: new Date().toLocaleTimeString(),
      operation: operation,
      kind: kind,
      message: message || ''
    });
    if (executionLog.length > EXEC_LOG_MAX) executionLog.pop();
    var wrap = document.getElementById('execLogWrap');
    var badge = document.getElementById('execLogBadge');
    var entriesEl = document.getElementById('execLogEntries');
    if (badge) badge.textContent = executionLog.length;
    if (entriesEl) {
      entriesEl.innerHTML = executionLog.slice(0, 50).map(function(e) {
        var cls = 'exec-log-entry exec-log-entry--' + e.kind;
        var msg = e.message ? (e.operation + ': ' + e.message) : e.operation;
        return '<div class="' + cls + '"><time>' + escapeHtml(e.time) + '</time>' + escapeHtml(msg) + '</div>';
      }).join('');
    }
  }

  function execLogToggle() {
    var wrap = document.getElementById('execLogWrap');
    var body = document.getElementById('execLogBody');
    var header = document.getElementById('execLogHeader');
    if (!wrap || !body) return;
    var open = body.getAttribute('hidden') === null;
    if (open) {
      body.setAttribute('hidden', '');
      if (header) header.setAttribute('aria-expanded', 'false');
      if (wrap) wrap.setAttribute('aria-expanded', 'false');
    } else {
      body.removeAttribute('hidden');
      if (header) header.setAttribute('aria-expanded', 'true');
      if (wrap) wrap.setAttribute('aria-expanded', 'true');
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var h = document.getElementById('execLogHeader');
    var c = document.getElementById('execLogClear');
    if (h) {
      h.addEventListener('click', execLogToggle);
      h.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); execLogToggle(); }
      });
    }
    if (c) c.addEventListener('click', function() {
      executionLog = [];
      var badge = document.getElementById('execLogBadge');
      var entriesEl = document.getElementById('execLogEntries');
      if (badge) badge.textContent = '0';
      if (entriesEl) entriesEl.innerHTML = '';
    });
    initApp();
  });

  function showBootstrapError(message) {
    var app = document.getElementById('app');
    var errEl = document.getElementById('bootstrapErrorScreen');
    var msgEl = document.getElementById('bootstrapErrorMessage');
    var retryBtn = document.getElementById('bootstrapErrorRetryBtn');
    if (app) app.style.display = 'none';
    if (errEl) errEl.style.display = 'flex';
    if (msgEl) msgEl.textContent = message || 'Something went wrong.';
    if (retryBtn) {
      retryBtn.onclick = function() {
        if (errEl) errEl.style.display = 'none';
        if (app) app.style.display = '';
        initApp();
      };
    }
  }

  function initApp() {
    document.getElementById('bootstrapErrorScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    google.script.run
      .withSuccessHandler(function(data) {
        state.bootstrap = data;
        renderNav(data.modules || []);
        bindEvents();
        loadClients();
        appendExecutionLog('Bootstrap', true, 'App loaded');
      })
      .withFailureHandler(function(err) {
        var msg = (err && err.message) ? err.message : String(err);
        appendExecutionLog('Bootstrap', false, msg);
        showBootstrapError(msg);
      })
      .WD_getBootstrapData();
  }

  function bindEvents() {
    document.getElementById('refreshClientsBtn').addEventListener('click', loadClients);
    document.getElementById('generateTrustOpsBtn').addEventListener('click', generateTrustOps);
    document.getElementById('copyMessageBtn').addEventListener('click', copyMessage);
    document.getElementById('clientSelect').addEventListener('change', onClientChange);
    var tmExport = document.getElementById('tmExportCsvBtn');
    if (tmExport) tmExport.addEventListener('click', function() {
      google.script.run.withSuccessHandler(function(r) { downloadCsv(r.csv, r.filename); }).withFailureHandler(showError).WD_exportTestMonitorCSV();
    });
    var cmExport = document.getElementById('cmExportCsvBtn');
    if (cmExport) cmExport.addEventListener('click', function() {
      google.script.run.withSuccessHandler(function(r) { downloadCsv(r.csv, r.filename); }).withFailureHandler(showError).WD_exportClientManagementCSV();
    });
    var fdmExport = document.getElementById('fdm-db-exportCsvBtn');
    if (fdmExport) fdmExport.addEventListener('click', function() {
      google.script.run.withSuccessHandler(function(r) { downloadCsv(r.csv, r.filename); }).withFailureHandler(showError).WD_exportFrameworkMappingCSV();
    });
    // Framework multi-select toggle
    document.getElementById('frameworksMsTrigger').addEventListener('click', toFxToggleDropdown);

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      var wrap = document.getElementById('frameworksMsWrap');
      if (wrap && !wrap.contains(e.target)) {
        toFxCloseDropdown();
      }
    });
    var dTrustOps = document.getElementById('dashboardTrustOpsBtn');
    if (dTrustOps) dTrustOps.addEventListener('click', function() { goToModule('trustops-v2a'); });
    var dTm = document.getElementById('dashboardTmBtn');
    if (dTm) dTm.addEventListener('click', function() { goToModule('test-monitoring'); });
    var dFm = document.getElementById('dashboardFmBtn');
    if (dFm) dFm.addEventListener('click', function() { goToModule('control-mapping'); });
    var testFetchBtn = document.getElementById('testFetchBtn');
    if (testFetchBtn) testFetchBtn.addEventListener('click', runTestFetch);
  }

  function runTestFetch() {
    var btn = document.getElementById('testFetchBtn');
    var wrap = document.getElementById('testResultWrap');
    var sel = document.getElementById('testClientSelect');
    var clientName = sel ? sel.value : 'Beacon Street Studios';
    if (!clientName) { showToast('error', 'Select a client.'); return; }
    if (btn) btn.disabled = true;
    if (wrap) {
      wrap.style.display = 'block';
      wrap.textContent = 'Checking…';
      wrap.className = 'info-banner';
    }
    google.script.run
      .withSuccessHandler(function(result) {
        if (btn) btn.disabled = false;
        if (!wrap) return;
        if (result.error) {
          wrap.textContent = 'Error: ' + result.error;
          wrap.className = 'info-banner';
          wrap.style.background = '#fef2f2';
          wrap.style.color = '#991b1b';
        } else {
          var lines = [
            'Client: ' + result.clientName,
            'Framework: ' + result.frameworkName + ' (' + result.frameworkId + ')',
            'Controls: ' + result.controlCount,
            'Tests: ' + result.totalTests,
            'Documents: ' + result.totalDocuments,
            '',
            'Sample (first 5 controls):'
          ];
          (result.sample || []).forEach(function(s) {
            lines.push('  — ' + s.controlName + ': ' + s.testCount + ' tests, ' + s.docCount + ' docs');
          });
          wrap.textContent = lines.join('\n');
          wrap.className = 'info-banner';
          wrap.style.background = '#f0fdf4';
          wrap.style.color = '#166534';
        }
        appendExecutionLog('Test fetch', result.error ? false : true, result.error || (result.controlCount + ' controls, ' + result.totalTests + ' tests, ' + result.totalDocuments + ' docs'));
      })
      .withFailureHandler(function(err) {
        if (btn) btn.disabled = false;
        if (wrap) {
          wrap.style.display = 'block';
          wrap.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
          wrap.className = 'info-banner';
          wrap.style.background = '#fef2f2';
          wrap.style.color = '#991b1b';
        }
        appendExecutionLog('Test fetch', false, err && err.message ? err.message : String(err));
      })
      .WD_testFetchTestsAndDocuments({ clientName: clientName });
  }

  function renderNav(modules) {
    var nav = document.getElementById('navList');
    if (!nav) return;
    nav.innerHTML = '';

    (modules || []).forEach(function(mod) {
      var btn = document.createElement('button');
      btn.className = 'nav-item' + (mod.id === state.activeModule ? ' active' : '');
      btn.type = 'button';
      btn.setAttribute('aria-current', mod.id === state.activeModule ? 'page' : 'false');
      btn.textContent = mod.label;
      btn.addEventListener('click', function() {
        setActiveModule(mod.id, mod.label);
      });
      nav.appendChild(btn);
    });
  }

  function goToModule(moduleId) {
    var mod = state.bootstrap && state.bootstrap.modules && state.bootstrap.modules.find(function(m) { return m.id === moduleId; });
    if (mod) setActiveModule(moduleId, mod.label);
  }

  function setActiveModule(moduleId, label) {
    state.activeModule = moduleId;
    document.querySelectorAll('.module-pane').forEach(function(el) {
      el.classList.remove('active');
    });
    document.querySelectorAll('.nav-item').forEach(function(el) {
      el.classList.remove('active');
    });

    var target = document.getElementById('module-' + moduleId);
    if (target) target.classList.add('active');

    document.querySelectorAll('.nav-item').forEach(function(btn) {
      var isActive = btn.textContent && btn.textContent.trim() === label;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-current', isActive ? 'page' : 'false');
    });
  }

  function loadClients() {
    var loadingOpt = '<option value="">Loading clients...</option>';
    var s1 = document.getElementById('clientSelect');
    var s3 = document.getElementById('fdmClientSelect');
    var s4 = document.getElementById('vrClientSelect');
    if (s1) s1.innerHTML = loadingOpt;
    if (s3) s3.innerHTML = loadingOpt;
    if (s4) s4.innerHTML = loadingOpt;

    google.script.run
      .withSuccessHandler(function(clients) {
        state.clients = clients || [];
        if (typeof vrState !== 'undefined') vrState.clients = state.clients;
        renderClients();
        appendExecutionLog('Clients', true, 'Loaded ' + (state.clients.length || 0));
      })
      .withFailureHandler(showError)
      .WD_getActiveClients();
  }

  function onClientChange() {
    var clientName = document.getElementById('clientSelect').value;
    state.workingClient = clientName || null;
    if (!clientName) {
      clearPrefillFields();
      return;
    }

    // Reset framework multi-select for the new client
    state.toFx.frameworks = [];
    state.toFx.loaded = false;
    state.toFx.loading = false;
    state.toFx.storedNames = '';
    toFxSetTriggerLabel('Loading...');
    document.getElementById('frameworksMsTrigger').disabled = false;
    toFxCloseDropdown();

    setFieldsLoading(true);

    google.script.run
      .withSuccessHandler(function(meta) {
        setFieldsLoading(false);
        if (!meta) return;

        // clientType: add option dynamically if it doesn't exist in the dropdown
        if (meta.clientType) {
          var sel = document.getElementById('clientType');
          var exists = Array.from(sel.options).some(function(o) { return o.value === meta.clientType; });
          if (!exists) {
            var opt = document.createElement('option');
            opt.value = meta.clientType;
            opt.textContent = meta.clientType;
            sel.appendChild(opt);
          }
          sel.value = meta.clientType;
        }

        if (meta.projectPlanLink) document.getElementById('projectPlanLink').value = meta.projectPlanLink;
        if (meta.evidenceDropLink) document.getElementById('evidenceDropLink').value = meta.evidenceDropLink;
        document.getElementById('cloudSecIncluded').checked = !!meta.cloudSecIncluded;
        if (meta.opsLead) document.getElementById('opsLead').value = meta.opsLead;
        // Store framework names for auto-check once dropdown loads
        if (meta.frameworks) {
          state.toFx.storedNames = meta.frameworks;
          toFxSetTriggerLabel(meta.frameworks);
        }
      })
      .withFailureHandler(function(err) {
        setFieldsLoading(false);
        showError(err);
      })
      .WD_getClientMetadata(clientName);
  }

  function clearPrefillFields() {
    document.getElementById('clientType').value = '';
    document.getElementById('projectPlanLink').value = '';
    document.getElementById('evidenceDropLink').value = '';
    document.getElementById('cloudSecIncluded').checked = false;
    document.getElementById('opsLead').value = '';
    state.toFx.frameworks = [];
    state.toFx.loaded = false;
    state.toFx.storedNames = '';
    toFxSetTriggerLabel('Select a client first');
    document.getElementById('frameworksMsTrigger').disabled = true;
    document.getElementById('frameworksMsOptions').innerHTML = '';
  }

  function setFieldsLoading(loading) {
    var fields = ['clientType', 'projectPlanLink', 'evidenceDropLink', 'opsLead'];
    fields.forEach(function(id) {
      document.getElementById(id).style.opacity = loading ? '0.5' : '';
    });
  }

  function renderClients() {
    var selects = [
      document.getElementById('clientSelect'),
      document.getElementById('vrClientSelect')
    ];

    selects.forEach(function(select) {
      if (!select) return;
      var currentVal = select.value;
      select.innerHTML = '<option value="">Select Client</option>';
      state.clients.forEach(function(client) {
        var opt = document.createElement('option');
        opt.value = client;
        opt.textContent = client;
        select.appendChild(opt);
      });
      if (currentVal) select.value = currentVal;
    });

    var testSel = document.getElementById('testClientSelect');
    if (testSel && state.clients.length) {
      var testCurrent = testSel.value;
      testSel.innerHTML = '';
      state.clients.forEach(function(client) {
        var opt = document.createElement('option');
        opt.value = client;
        opt.textContent = client;
        testSel.appendChild(opt);
      });
      if (state.clients.indexOf('Beacon Street Studios') >= 0) testSel.value = 'Beacon Street Studios';
      else if (testCurrent && state.clients.indexOf(testCurrent) >= 0) testSel.value = testCurrent;
      else if (state.clients[0]) testSel.value = state.clients[0];
    }
  }

  function generateTrustOps() {
    var selected = toFxGetSelected();
    var payload = {
      clientName: document.getElementById('clientSelect').value,
      clientType: document.getElementById('clientType').value,
      projectPlanLink: document.getElementById('projectPlanLink').value,
      evidenceDropLink: document.getElementById('evidenceDropLink').value,
      cloudSecIncluded: document.getElementById('cloudSecIncluded').checked,
      opsLead: document.getElementById('opsLead').value,
      selectedFrameworkIds: selected.ids,
      selectedFrameworkNames: selected.names
    };

    if (!payload.clientName) {
      showToast('error', 'Please select a client first.');
      return;
    }
    if (!isValidUrl(payload.projectPlanLink)) {
      showToast('error', 'Please enter a valid URL for Project Plan Link.');
      return;
    }
    if (!isValidUrl(payload.evidenceDropLink)) {
      showToast('error', 'Please enter a valid URL for Evidence Drop Folder Link.');
      return;
    }
    var hasFrameworks = (payload.selectedFrameworkIds && payload.selectedFrameworkIds.length > 0) ||
      (state.toFx.storedNames && String(state.toFx.storedNames).trim() !== '');
    if (!hasFrameworks) {
      showToast('info', 'No frameworks selected. Add frameworks in Client Management for correct scoping, or select frameworks above.');
    }

    setGlobalLoading(true);

    google.script.run
      .withSuccessHandler(function(result) {
        setGlobalLoading(false);
        state.trustOpsResult = result;
        renderTrustOpsResult(result);
        appendExecutionLog('Trust Ops', true, (result.count != null ? result.count : 0) + ' items');
      })
      .withFailureHandler(function(err) {
        setGlobalLoading(false);
        showError(err);
      })
      .WD_generateTrustOpsV2A(payload);
  }

  function renderTrustOpsResult(result) {
    var meta = document.getElementById('resultsMeta');
    var items = result.items || result.tests || [];
    meta.textContent = 'Outstanding items found: ' + result.count +
      ' (' + (result.tests ? result.tests.length : 0) + ' tests, ' +
      (result.items ? result.items.length - (result.tests ? result.tests.length : 0) : 0) + ' documents)';

    document.getElementById('formattedOutput').value = result.textOutput || '';
    document.getElementById('formattedPreview').innerHTML = result.htmlOutput || '';

    var wrap = document.getElementById('resultsTableWrap');

    if (!items.length) {
      wrap.innerHTML = '<div class="empty-state">No outstanding items found.</div>';
      return;
    }

    var rows = items.map(function(item) {
      var isDoc = item.itemType === 'Document';
      var entities = !isDoc && item.failingEntityCount
        ? (item.showEntityListInline
            ? item.failingEntities.map(function(e) { return escapeHtml(e); }).join('<br>')
            : (item.failingEntityCount + ' items'))
        : '-';
      var nameCell = item.link
        ? '<a href="' + escapeHtml(item.link) + '" target="_blank">' + escapeHtml(item.name) + '</a>'
        : escapeHtml(item.name);
      var pillClass = isDoc ? 'doc-type' : 'outstanding';
      return '<tr>' +
        '<td>' + nameCell + '</td>' +
        '<td><span class="pill ' + pillClass + '">' + escapeHtml(item.itemType || 'Automated Test') + '</span></td>' +
        '<td><span class="pill outstanding">' + escapeHtml(item.normalizedStatus) + '</span></td>' +
        '<td>' + escapeHtml(item.dueLabel || '-') + '</td>' +
        '<td>' + (isDoc ? '-' : escapeHtml(String(item.failingEntityCount || 0))) + '</td>' +
        '<td>' + entities + '</td>' +
        '</tr>';
    }).join('');

    wrap.innerHTML =
      '<table class="results-table">' +
        '<thead><tr>' +
          '<th>Name</th><th>Type</th><th>Status</th><th>Due</th><th>Failing Count</th><th>Failing Entities</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  function copyMessage() {
    var val = document.getElementById('formattedOutput').value || '';
    if (!val) {
      alert('Nothing to copy yet.');
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).then(function() {
        alert('Message copied.');
      }).catch(function() {
        alert('Copy failed. Please copy manually.');
      });
    } else {
      alert('Copy failed. Please copy manually.');
    }
  }

  function showToast(type, message) {
    type = type || 'info';
    message = String(message || '').trim();
    if (!message) return;
    var container = document.getElementById('toastContainer');
    if (!container) return;
    var toast = document.createElement('div');
    toast.className = 'toast toast--' + type;
    toast.setAttribute('role', 'alert');
    var span = document.createElement('span');
    span.textContent = message;
    toast.appendChild(span);
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'toast-close';
    close.setAttribute('aria-label', 'Dismiss');
    close.textContent = '\u00d7';
    close.onclick = function() { toast.remove(); };
    toast.appendChild(close);
    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) toast.remove();
    }, 6000);
  }

  function showError(err) {
    console.error(err);
    var msg = (err && err.message) ? err.message : String(err);
    appendExecutionLog('Error', false, msg);
    showToast('error', msg);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isValidUrl(s) {
    if (!s || typeof s !== 'string') return true;
    s = s.trim();
    if (!s) return true;
    try {
      var u = new URL(s);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch (e) {
      return false;
    }
  }

  function downloadCsv(csv, filename) {
    if (!csv) return;
    var bom = '\uFEFF';
    var blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename || 'export.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  var _loadingTimeoutId = null;
  function setGlobalLoading(visible) {
    var overlay = document.getElementById('globalLoadingOverlay');
    if (_loadingTimeoutId) {
      clearTimeout(_loadingTimeoutId);
      _loadingTimeoutId = null;
    }
    if (visible) {
      document.body.classList.add('loading');
      if (overlay) { overlay.style.display = 'flex'; overlay.setAttribute('aria-hidden', 'false'); }
      _loadingTimeoutId = setTimeout(function() {
        _loadingTimeoutId = null;
        showToast('info', 'This is taking longer than usual. You can keep waiting or try again later.');
      }, 55000);
    } else {
      document.body.classList.remove('loading');
      if (overlay) { overlay.style.display = 'none'; overlay.setAttribute('aria-hidden', 'true'); }
    }
  }

  // ── Trust Ops Framework Multi-Select ────────────────────────────────────────

  function toFxToggleDropdown() {
    var trigger = document.getElementById('frameworksMsTrigger');
    var dropdown = document.getElementById('frameworksMsDropdown');
    var isOpen = dropdown.classList.contains('open');

    if (isOpen) {
      toFxCloseDropdown();
      return;
    }

    // Lazy-load frameworks on first open
    if (!state.toFx.loaded && !state.toFx.loading) {
      var clientName = document.getElementById('clientSelect').value;
      if (!clientName) return;
      toFxFetchFrameworks(clientName);
    }

    trigger.classList.add('open');
    dropdown.classList.add('open');
  }

  function toFxCloseDropdown() {
    document.getElementById('frameworksMsTrigger').classList.remove('open');
    document.getElementById('frameworksMsDropdown').classList.remove('open');
  }

  function toFxFetchFrameworks(clientName) {
    state.toFx.loading = true;
    document.getElementById('frameworksMsOptions').innerHTML =
      '<div class="ms-empty">Loading frameworks...</div>';
    document.getElementById('frameworksMsTrigger').classList.add('open');
    document.getElementById('frameworksMsDropdown').classList.add('open');

    google.script.run
      .withSuccessHandler(function(frameworks) {
        state.toFx.frameworks = frameworks || [];
        state.toFx.loaded = true;
        state.toFx.loading = false;
        toFxRenderOptions();
      })
      .withFailureHandler(function(err) {
        state.toFx.loading = false;
        document.getElementById('frameworksMsOptions').innerHTML =
          '<div class="ms-empty">Error loading frameworks.</div>';
        console.error('Framework load error:', err);
      })
      .WD_getFrameworks(clientName);
  }

  function toFxRenderOptions() {
    var container = document.getElementById('frameworksMsOptions');
    var frameworks = state.toFx.frameworks;

    if (!frameworks.length) {
      container.innerHTML = '<div class="ms-empty">No frameworks found.</div>';
      toFxUpdateTriggerLabel();
      return;
    }

    // Build stored names set for auto-check matching
    var storedSet = {};
    if (state.toFx.storedNames) {
      state.toFx.storedNames.split(',').forEach(function(n) {
        storedSet[n.trim().toLowerCase()] = true;
      });
    }

    container.innerHTML = '';
    frameworks.forEach(function(fw) {
      var isChecked = storedSet[fw.name.trim().toLowerCase()] || false;

      var label = document.createElement('label');
      label.className = 'ms-option';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = fw.id;
      cb.dataset.name = fw.name;
      cb.checked = isChecked;
      cb.addEventListener('change', toFxUpdateTriggerLabel);

      var span = document.createElement('span');
      span.className = 'ms-option-label';
      span.textContent = fw.name;

      label.appendChild(cb);
      label.appendChild(span);
      container.appendChild(label);
    });

    toFxUpdateTriggerLabel();
  }

  function toFxGetSelected() {
    var checkboxes = document.querySelectorAll('#frameworksMsOptions input[type="checkbox"]:checked');
    var ids = [], names = [];
    checkboxes.forEach(function(cb) {
      ids.push(cb.value);
      names.push(cb.dataset.name);
    });
    return { ids: ids, names: names };
  }

  function toFxUpdateTriggerLabel() {
    var selected = toFxGetSelected();
    toFxSetTriggerLabel(
      selected.names.length ? selected.names.join(', ') : 'All frameworks (no filter)'
    );
  }

  function toFxSetTriggerLabel(text) {
    document.getElementById('frameworksMsText').textContent = text;
  }

  // ── End Trust Ops Framework Multi-Select ────────────────────────────────────

  // ── Drive Utility ────────────────────────────────────────────────────────────

  var DU_TABS = ['rename', 'logo', 'pdf', 'dochistory', 'parser'];

  function duSetTab(tabId) {
    DU_TABS.forEach(function(id) {
      var pane = document.getElementById('du-tab-' + id);
      if (pane) pane.style.display = id === tabId ? '' : 'none';
      var btn = document.getElementById('du-tabBtn-' + id);

  function duDhComputeVersion() {
    var current = (document.getElementById('du-dh-currentVersion').value || '').trim();
    var changeType = document.getElementById('du-dh-changeType').value;
    var newVersionEl = document.getElementById('du-dh-newVersion');
    var descEl = document.getElementById('du-dh-description');

    // Auto-fill description on No Change (only if blank)
    if (changeType === 'nochange' && !descEl.value.trim()) {
      descEl.value = 'Annual Review. No Change.';
    }

    if (!current) { newVersionEl.value = ''; return; }

    var parts = current.split('.').map(Number);
    if (parts.some(isNaN)) { newVersionEl.value = current; return; }

    if (changeType === 'minor') {
      if (parts.length === 1) parts.push(1);
      else parts[parts.length - 1]++;
    } else if (changeType === 'major') {
      parts[0]++;
      for (var i = 1; i < parts.length; i++) parts[i] = 0;
    }
    // nochange: keep as-is

    newVersionEl.value = parts.join('.');
  }

  function duRun(tool) {
    var runTypeId = tool === 'dochistory' ? 'du-dh-runType' : ('du-' + tool + '-runType');
    var runTypeEl = document.getElementById(runTypeId);
    var dryRun = runTypeEl ? runTypeEl.value === 'preview' : false;

    var payload = {};
    var fnName = '';

    if (tool === 'rename') {
      payload = {
        folderUrl: document.getElementById('du-rename-folderUrl').value.trim(),
        mode: document.getElementById('du-rename-mode').value,
        findText: document.getElementById('du-rename-find').value,
        replaceText: document.getElementById('du-rename-replace').value,
        multiPairs: document.getElementById('du-rename-pairs').value,
        includeSubfolders: document.getElementById('du-rename-subfolders').checked,
        renameFoldersToo: document.getElementById('du-rename-folders').checked,
        caseInsensitive: document.getElementById('du-rename-caseInsensitive').checked,
        dryRun: dryRun
      };
      fnName = 'DU_runRename';
    }
    else if (tool === 'logo') {
      payload = {
        mode: document.getElementById('du-logo-mode').value,
        logoFileUrl: document.getElementById('du-logo-logoUrl').value.trim(),
        folderUrl: document.getElementById('du-logo-folderUrl').value.trim(),
        fileUrls: document.getElementById('du-logo-fileUrls').value.trim(),
        includeSubfolders: document.getElementById('du-logo-subfolders').checked,
        replaceLogo: document.getElementById('du-logo-replace').checked,
        dryRun: dryRun
      };
      fnName = 'DU_runLogoOnly';
    }
    else if (tool === 'pdf') {
      payload = {
        mode: document.getElementById('du-pdf-mode').value,
        folderUrl: document.getElementById('du-pdf-folderUrl').value.trim(),
        fileUrls: document.getElementById('du-pdf-fileUrls').value.trim(),
        outputFolderUrl: document.getElementById('du-pdf-outputFolderUrl').value.trim(),
        includeSubfolders: document.getElementById('du-pdf-subfolders').checked,
        overwrite: document.getElementById('du-pdf-overwrite').checked,
        dryRun: dryRun
      };
      fnName = 'DU_runPdfExport';
    }
    else if (tool === 'dochistory') {
      var dhVersion = document.getElementById('du-dh-newVersion').value.trim()
                   || document.getElementById('du-dh-currentVersion').value.trim();
      if (!dhVersion) { alert('Please enter a Current Version.'); return; }

      // Build fields array — only include fields that have a value
      var dhFields = [];
      var dhDate = document.getElementById('du-dh-date').value.trim();
      var dhDesc = document.getElementById('du-dh-description').value.trim();
      var dhWritten = document.getElementById('du-dh-writtenBy').value.trim();
      var dhApproved = document.getElementById('du-dh-approvedBy').value.trim();
      if (dhDate)    dhFields.push({ field: 'Date',        value: dhDate });
      if (dhDesc)    dhFields.push({ field: 'Description', value: dhDesc });
      if (dhWritten) dhFields.push({ field: 'Written by',  value: dhWritten });
      if (dhApproved)dhFields.push({ field: 'Approved by', value: dhApproved });
      if (!dhFields.length) { alert('Please fill in at least one field to update.'); return; }

      payload = {
        mode: document.getElementById('du-dh-mode').value,
        folderUrl: document.getElementById('du-dh-folderUrl').value.trim(),
        fileUrls: document.getElementById('du-dh-fileUrls').value.trim(),
        version: dhVersion,
        fields: dhFields,
        includeSubfolders: document.getElementById('du-dh-subfolders').checked,
        addIfMissing: document.getElementById('du-dh-addIfMissing').checked,
        dryRun: dryRun
      };
      fnName = 'DU_runDocHistoryUpdate';
    }
    else if (tool === 'parser') {
      payload = {
        folderUrl: document.getElementById('du-fp-folderUrl').value.trim(),
        clientName: document.getElementById('du-fp-clientName').value.trim(),
        outputFolderUrl: document.getElementById('du-fp-outputFolderUrl').value.trim(),
        sheetName: document.getElementById('du-fp-sheetName').value.trim(),
        includeSubfolders: document.getElementById('du-fp-subfolders').checked
      };
      fnName = 'DU_runFolderParser';
    }

    var statusEl = document.getElementById('du-status');
    var statusText = document.getElementById('du-statusText');
    var statusBadge = document.getElementById('du-statusBadge');

    statusEl.className = 'du-status';
    statusText.textContent = 'Running…';
    statusBadge.textContent = 'running';
    document.getElementById('du-output').textContent = '';
    document.getElementById('du-resultBadge').textContent = '…';
    setGlobalLoading(true);

    var runner = google.script.run
      .withSuccessHandler(function(result) {
        setGlobalLoading(false);
        statusEl.className = 'du-status good';
        statusBadge.textContent = 'done';
        duShowResult(tool, result, dryRun);
      })
      .withFailureHandler(function(err) {
        setGlobalLoading(false);
        statusEl.className = 'du-status bad';
        statusText.textContent = err && err.message ? err.message : String(err);
        statusBadge.textContent = 'error';
        document.getElementById('du-output').textContent = 'ERROR: ' + (err && err.message ? err.message : String(err));
        document.getElementById('du-resultBadge').textContent = 'error';
      });

    if (fnName === 'DU_runRename')               runner.DU_runRename(payload);
    else if (fnName === 'DU_runLogoOnly')         runner.DU_runLogoOnly(payload);
    else if (fnName === 'DU_runPdfExport')        runner.DU_runPdfExport(payload);
    else if (fnName === 'DU_runDocHistoryUpdate') runner.DU_runDocHistoryUpdate(payload);
    else if (fnName === 'DU_runFolderParser')     runner.DU_runFolderParser(payload);
  }

  function duShowResult(tool, result, dryRun) {
    var lines = [];
    var statusText = document.getElementById('du-statusText');
    var resultBadge = document.getElementById('du-resultBadge');

    if (tool === 'rename') {
      lines.push((dryRun ? 'PREVIEW — ' : '') + 'Rename Files');
      lines.push('Folder: ' + (result.rootFolderName || '—'));
      lines.push('Scanned: ' + (result.scannedFiles || 0) + ' file(s) in ' + (result.scannedFolders || 0) + ' folder(s)');
      lines.push('Changes: ' + (result.changesCount || 0));
      lines.push('');
      (result.changes || []).forEach(function(c) {
        lines.push('[' + c.type + '] "' + c.oldName + '" → "' + c.newName + '"');
      });
      statusText.textContent = (dryRun ? 'Preview: ' : '') + (result.changesCount || 0) + ' change(s)';
      resultBadge.textContent = result.changesCount || 0;
    }
    else if (tool === 'logo') {
      lines.push((dryRun ? 'PREVIEW — ' : '') + 'Logo Only');
      if (result.rootFolderName) lines.push('Folder: ' + result.rootFolderName);
      lines.push('Scanned: ' + (result.scannedFiles || 0) + ' file(s), ' + (result.scannedDocs || 0) + ' doc(s)');
      lines.push('Changes: ' + (result.changesCount || 0));
      lines.push('');
      (result.changes || []).forEach(function(c) {
        lines.push('[' + c.logoAction + '] ' + c.name);
        if (c.message) lines.push('  → ' + c.message);
      });
      statusText.textContent = (dryRun ? 'Preview: ' : '') + (result.changesCount || 0) + ' doc(s) updated';
      resultBadge.textContent = result.changesCount || 0;
    }
    else if (tool === 'pdf') {
      lines.push((dryRun ? 'PREVIEW — ' : '') + 'Convert to PDF');
      if (result.rootFolderName) lines.push('Source: ' + result.rootFolderName);
      lines.push('Output folder: ' + (result.outputFolderName || '—'));
      if (result.outputFolderUrl) lines.push('URL: ' + result.outputFolderUrl);
      lines.push('');
      lines.push('Converted: ' + (result.convertedCount || 0) + '  Copied: ' + (result.copiedCount || 0) + '  Skipped: ' + (result.skippedCount || 0) + '  Errors: ' + (result.errorCount || 0));
      lines.push('');
      (result.items || []).forEach(function(it) {
        var icon = it.status === 'converted' ? '✓' : it.status === 'copied' ? '⊕' : it.status === 'error' ? '✗' : '–';
        lines.push(icon + ' ' + it.name);
        if (it.message) lines.push('  ' + it.message);
        if (it.pdfUrl) lines.push('  ' + it.pdfUrl);
      });
      statusText.textContent = (dryRun ? 'Preview: ' : '') + (result.convertedCount || 0) + ' converted, ' + (result.errorCount || 0) + ' error(s)';
      resultBadge.textContent = (result.convertedCount || 0) + ' files';
    }
    else if (tool === 'dochistory') {
      lines.push((dryRun ? 'PREVIEW — ' : '') + 'Update Doc History');
      if (result.rootFolderName) lines.push('Source: ' + result.rootFolderName);
      lines.push('Scanned: ' + (result.scannedDocs || 0) + ' doc(s)');
      lines.push('Updated: ' + (result.updatedCount || 0) + '  Preview: ' + (result.previewCount || 0) + '  Skipped: ' + (result.skippedCount || 0) + '  Errors: ' + (result.errorCount || 0));
      lines.push('');
      (result.changes || []).forEach(function(c) {
        lines.push('[' + c.status + '] ' + c.name);
        if (c.message) lines.push('  ' + c.message);
        (c.fieldUpdates || []).forEach(function(fu) {
          if (fu.status === 'updated' || fu.status === 'preview') {
            lines.push('  ' + fu.field + ': "' + fu.oldValue + '" → "' + fu.newValue + '"');
          } else if (fu.status === 'skipped') {
            lines.push('  ' + fu.field + ': ' + (fu.message || 'skipped'));
          }
        });
      });
      statusText.textContent = (dryRun ? 'Preview: ' : 'Updated: ') + (dryRun ? result.previewCount : result.updatedCount) + ' doc(s)';
      resultBadge.textContent = dryRun ? result.previewCount || 0 : result.updatedCount || 0;
    }
    else if (tool === 'parser') {
      lines.push('Folder Parser');
      lines.push('Docs scanned: ' + (result.docsScanned || 0));
      lines.push('Rows created: ' + (result.rowsCreated || 0));
      lines.push('Sheet: ' + (result.sheetName || '—'));
      lines.push('');
      if (result.sheetUrl) lines.push(result.sheetUrl);
      statusText.textContent = (result.rowsCreated || 0) + ' row(s) in "' + (result.sheetName || '') + '"';
      resultBadge.textContent = result.rowsCreated || 0;
    }

    document.getElementById('du-output').textContent = lines.join('\n');
  }

  var tmState = {
    loaded:     false,
    allRows:    [],   // full dataset from server
    filtered:   [],   // rows after search filter
    sorted:     [],   // rows after sort (all filtered, pre-pagination)
    selected:   {},   // { clientName: true } for checked rows
    refreshing: {},   // { clientName: true } — rows currently being refreshed
    rowErrors:  {},   // { clientName: errorMsg }
    sortCol:    'totalOut',
    sortDir:    'desc',
    page:       1,
    pageSize:   20

  /**
   * Called when the Test Monitoring module is first activated.
   * Loads cached data from the DB (no Vanta call).
   */
  function tmInit() {
    if (tmState.loaded) return;
    tmSetStatus('loading');
    google.script.run
      .withSuccessHandler(function(result) {
        tmState.loaded = true;
        tmHandleData(result);
        tmSetStatus('idle');
        var n = (result && result.rows) ? result.rows.length : (tmState.allRows ? tmState.allRows.length : 0);
        appendExecutionLog('Test Monitor', true, 'Loaded ' + n + ' clients');
      })
      .withFailureHandler(function(err) {
        tmSetStatus('idle');
        appendExecutionLog('Test Monitor', false, err && err.message ? err.message : String(err));
        document.getElementById('tmTableBody').innerHTML =
          '<tr><td colspan="13" class="tm-empty-cell">Error loading data: ' + escapeHtml(err.message || String(err)) + '</td></tr>';
      })
      .TM_getTestMonitorData();
  }

  /**
   * Refresh All — Wave 1 only: fetch tests/docs for each client.
   * Framework scoping is applied from FrameworkMappingDB (pre-loaded).
   * To rebuild framework maps, use "Update Framework Scoping".
   */
  function tmRefreshAll() {
    var btn    = document.getElementById('tmRefreshBtn');
    var selBtn = document.getElementById('tmRefreshSelectedBtn');
    btn.disabled    = true;
    btn.textContent = 'Loading tests…';
    selBtn.disabled = true;

    var names = tmState.allRows.map(function(r) { return r.clientName; });
    if (!names.length) {
      btn.disabled = false; btn.textContent = 'Refresh All from Vanta';
      selBtn.disabled = false;
      return;
    }

    tmState.rowErrors = {};
    tmRefreshSequential(names, 0, [], function(errors) {
      if (errors.length) console.warn('TM refresh errors:', errors);
      appendExecutionLog('Test Monitor', errors.length ? false : true, errors.length ? errors.length + ' error(s)' : 'Refresh complete');
      btn.disabled    = false;
      btn.textContent = 'Refresh All from Vanta';
      tmUpdateRefreshSelectedBtn();
    });
  }

  function tmFullRefresh() {
    var names = tmState.allRows.map(function(r) { return r.clientName; });
    if (!names.length) { showToast('info', 'No clients to refresh. Load Test Monitor first.'); return; }
    var btn = document.getElementById('tmRefreshBtn');
    var fullBtn = document.getElementById('tmFullRefreshBtn');
    var enrichBtn = document.getElementById('tmEnrichSelectedBtn');
    var selBtn = document.getElementById('tmRefreshSelectedBtn');
    if (fullBtn) fullBtn.disabled = true;
    if (btn) btn.disabled = true;
    if (enrichBtn) enrichBtn.disabled = true;
    if (selBtn) selBtn.disabled = true;
    tmState.rowErrors = {};
    tmRefreshSequential(names, 0, [], function(errors1) {
      if (errors1.length) console.warn('TM full refresh Wave 1 errors:', errors1);
      if (fullBtn) fullBtn.textContent = 'Scoping ' + names.length + ' of ' + names.length + '\u2026';
      tmEnrichSequential(names, 0, [], function(errors2) {
        if (errors2.length) console.warn('TM full refresh Wave 2 errors:', errors2);
        if (fullBtn) { fullBtn.disabled = false; fullBtn.textContent = 'Full refresh (Wave 1+2)'; }
        if (btn) btn.disabled = false;
        if (enrichBtn) { enrichBtn.disabled = false; enrichBtn.textContent = 'Update Framework Scoping'; }
        tmUpdateRefreshSelectedBtn();
        appendExecutionLog('Test Monitor', (errors1.length + errors2.length) ? false : true, (errors1.length + errors2.length) ? 'Full refresh done with errors' : 'Full refresh complete');
        showToast('success', 'Full refresh complete.');
      });
    });
  }

  /**
   * Update Framework Scoping (selected clients) — Wave 2 only.
   * Traverses frameworks → controls → tests/docs via Vanta API,
   * rebuilds TMCache and FrameworkMappingDB, then re-applies scoping.
   * Run this after adding a new client or when framework assignments change.
   */
  function tmEnrichSelected() {
    var selected = tmGetSelectedNames();
    var names    = selected.length ? selected : tmState.allRows.map(function(r) { return r.clientName; });
    if (!names.length) return;

    selBtn.disabled = true;

    tmEnrichSequential(names, 0, [], function(errors) {
      if (errors.length) console.warn('TM enrich errors:', errors);
      btn.disabled    = false;
      btn.textContent = 'Update Framework Scoping';

      tmUpdateRefreshSelectedBtn();
    });

  /**
   * Wave 1 streaming engine — calls TM_refreshClientData for each client
   * and merges the returned row object into state immediately.
   */
  function tmRefreshSequential(names, index, errors, onComplete) {
    if (index >= names.length) {
      if (onComplete) onComplete(errors);
      return;
    }

    var btn = document.getElementById('tmRefreshBtn');
    if (btn) btn.textContent = 'Syncing ' + (index + 1) + ' of ' + names.length + '\u2026';

    var clientName = names[index];
    tmState.refreshing[clientName] = true;
    tmRenderTable();

    google.script.run
      .withSuccessHandler(function(row) {
        tmState.refreshing[clientName] = false;
        delete tmState.rowErrors[clientName];
        tmMergeRow(row);
        document.getElementById('tmLastRefresh').textContent =
          'Last refresh: ' + tmFormatLastRefresh(new Date().toISOString());
        tmApplySearch(true);
        tmRefreshSequential(names, index + 1, errors, onComplete);
      })
      .withFailureHandler(function(err) {
        tmState.refreshing[clientName] = false;
        tmState.rowErrors[clientName] = err.message || String(err);
        errors.push(clientName + ': ' + (err.message || String(err)));
        tmRenderTable();
        tmRefreshSequential(names, index + 1, errors, onComplete);
      })
      .TM_refreshClientData(clientName);
  }

  /**
   * Wave 2 streaming engine — calls TM_enrichClientFrameworks for each client.
   * Result may be null (no frameworks configured) — skips DOM update in that case.
   */
  function tmEnrichSequential(names, index, errors, onComplete) {
    if (index >= names.length) {
      if (onComplete) onComplete(errors);
      return;
    }

    var btn = document.getElementById('tmEnrichSelectedBtn');
    if (btn) btn.textContent = 'Scoping ' + (index + 1) + ' of ' + names.length + '\u2026';

    var clientName = names[index];
    tmState.refreshing[clientName] = true;
    tmRenderTable();

    google.script.run
      .withSuccessHandler(function(row) {
        tmState.refreshing[clientName] = false;
        delete tmState.rowErrors[clientName];
        if (row) tmMergeRow(row); // null = no frameworks, P1 result stands
        tmApplySearch(true);
        tmEnrichSequential(names, index + 1, errors, onComplete);
      })
      .withFailureHandler(function(err) {
        tmState.refreshing[clientName] = false;
        tmState.rowErrors[clientName] = err.message || String(err);
        errors.push(clientName + ': ' + (err.message || String(err)));
        tmRenderTable();
        tmEnrichSequential(names, index + 1, errors, onComplete);
      })
      .TM_enrichClientFrameworks(clientName);
  }

  /** Merges a single updated row object into tmState.allRows. */
  function tmMergeRow(row) {
    if (!row || !row.clientName) return;
    var key = row.clientName.toLowerCase();
    for (var i = 0; i < tmState.allRows.length; i++) {
      if (tmState.allRows[i].clientName.toLowerCase() === key) {
        tmState.allRows[i] = row;
        return;
      }
    }
  }


  /** Processes a full server result and updates all UI components. */
  function tmHandleData(result) {
    tmState.allRows = result.rows || [];
    tmApplySearch();
    document.getElementById('tmLastRefresh').textContent =
      'Last refresh: ' + tmFormatLastRefresh(result.lastRefresh);
  }

  /** Renders the four summary stat cards from the full row set. */
  function tmRenderStats(rows) {
    var totalOutTests = 0;
    var totalOutDocs  = 0;
    var sumPct        = 0;
    var below70       = 0;
    var scopedCount   = 0;

    rows.forEach(function(r) {
      if (!r.frameworks) return;
      scopedCount++;
      totalOutTests += r.outTests;
      totalOutDocs  += r.outDocs;
      sumPct        += r.completedPct;
      if (r.completedPct < 70) below70++;
    });

    var avgPct = scopedCount ? Math.round(sumPct / scopedCount) : 0;

    document.getElementById('tmStatOutTests').textContent = scopedCount ? totalOutTests : '—';
    document.getElementById('tmStatOutDocs').textContent  = scopedCount ? totalOutDocs  : '—';
    document.getElementById('tmStatAvgPct').textContent   = scopedCount ? avgPct + '%'  : '—';
    document.getElementById('tmStatBelow70').textContent  = scopedCount ? below70       : '—';
  }

  /** Renders the data table from tmState.sorted, applying current page. */
  function tmRenderTable() {
    var tbody   = document.getElementById('tmTableBody');
    var COLSPAN = 13; // 1 checkbox + 12 data cols

    var allSorted = tmState.sorted;
    var pageRows;
    if (tmState.pageSize === 0) {
      pageRows = allSorted;
    } else {
      var start = (tmState.page - 1) * tmState.pageSize;
      pageRows = allSorted.slice(start, start + tmState.pageSize);
    }

    if (!pageRows.length) {
      tbody.innerHTML = tmState.allRows.length
        ? '<tr><td colspan="' + COLSPAN + '" class="tm-empty-cell">No clients match your search.</td></tr>'
        : '<tr><td colspan="' + COLSPAN + '" class="tm-empty-cell">No data yet. Click <strong>Refresh All from Vanta</strong> to pull data.</td></tr>';
      tmUpdateSelectAll();
      return;
    }

    tbody.innerHTML = pageRows.map(function(r) {
      var checked      = !!tmState.selected[r.clientName];
      var isRefreshing = !!tmState.refreshing[r.clientName];
      var rowError     = tmState.rowErrors[r.clientName] || '';
      var noFw          = !r.frameworks;
      var isPlaceholder = (r.updatedAt == null);

      // Computed values for new columns
      var passingTests = Math.max(0, (r.activeTests || 0) - (r.outTests || 0));
      var passingDocs  = Math.max(0, (r.activeDocs  || 0) - (r.outDocs  || 0));

      // Client cell: name + inline refresh button / spinner
      var clientCell =
        '<td class="tm-client-cell">' +
          '<span class="tm-client-name">' + escapeHtml(r.clientName) + '</span>' +
          (isRefreshing
            ? '<span class="tm-row-spinner" title="Refreshing…"></span>'
            : '<button class="tm-row-refresh-btn" type="button" title="Refresh from Vanta" aria-label="Refresh ' + escapeHtml(r.clientName) + ' from Vanta" onclick="tmRefreshOneClient(\'' +
                escapeHtml(r.clientName).replace(/'/g, "\\'") + '\')">↻</button>') +
          (rowError ? '<span class="tm-row-err-icon" title="' + escapeHtml(rowError) + '">⚠</span>' : '') +
        '</td>';

      var rowCls = (checked ? 'tm-row-selected ' : '') + (isRefreshing ? 'tm-row-refreshing' : '');

      return '<tr class="' + rowCls + '" data-client="' + escapeHtml(r.clientName) + '">' +
        '<td class="tm-cb-cell"><input type="checkbox" class="tm-row-cb" data-client="' +
          escapeHtml(r.clientName) + '"' + (checked ? ' checked' : '') + ' /></td>' +
        clientCell +
        '<td>' + (r.frameworks
          ? '<span class="tm-fw-badge">' + escapeHtml(r.frameworks) + '</span>'
          : '<span class="tm-badge tm-badge-nofw">No framework</span>') + '</td>' +
        (noFw
          ? '<td colspan="10" class="tm-muted tm-nofw-hint">Set a framework in Client Management, then refresh.</td>'
          : isPlaceholder
          ? '<td colspan="10" class="tm-muted tm-nofw-hint">Not yet fetched — click ↻ to refresh.</td>'
          : (
            // Tests group
            '<td class="tm-td-tests">' + (passingTests || 0) + '</td>' +
            '<td class="tm-td-tests tm-muted">' + (r.deactivatedTests || 0) + '</td>' +
            '<td class="tm-td-tests">' + tmCountBadge(r.outTests, r.outTests > 20 ? 'danger' : r.outTests > 10 ? 'warn' : '') + '</td>' +
            '<td class="tm-td-tests">' + tmProgressCell(r.testPct) + '</td>' +
            // Docs group
            '<td class="tm-td-docs">' + (passingDocs || 0) + '</td>' +
            '<td class="tm-td-docs tm-muted">' + (r.deactivatedDocs || 0) + '</td>' +
            '<td class="tm-td-docs">' + tmCountBadge(r.outDocs, r.outDocs > 20 ? 'danger' : r.outDocs > 10 ? 'warn' : '') + '</td>' +
            '<td class="tm-td-docs">' + tmProgressCell(r.docPct) + '</td>' +
            // Overall
            '<td>' + tmCountBadge(r.totalOut, r.totalOut > 30 ? 'danger' : r.totalOut > 15 ? 'warn' : '') + '</td>' +
            '<td>' + tmProgressCell(r.completedPct) + '</td>'
          )
        ) +
      '</tr>';
    }).join('');

    document.querySelectorAll('.tm-row-cb').forEach(function(cb) {
      cb.addEventListener('change', tmOnRowCbChange);
    });

    tmUpdateSelectAll();
    tmUpdateRefreshSelectedBtn();
  }

  /** Toggles a single row's selected state. */
  function tmOnRowCbChange(e) {
    var name = e.target.dataset.client;
    tmState.selected[name] = e.target.checked;
    var row = e.target.closest('tr');
    if (row) row.classList.toggle('tm-row-selected', e.target.checked);
    tmUpdateSelectAll();
    tmUpdateRefreshSelectedBtn();
  }

  /** Selects / deselects all currently sorted rows (across all pages). */
  function tmOnSelectAllChange() {
    var allCb   = document.getElementById('tmSelectAll');
    var checked = allCb.checked;
    tmState.sorted.forEach(function(r) {
      tmState.selected[r.clientName] = checked;
    });
    tmRenderTable();
  }

  /** Syncs the select-all checkbox state (checked / indeterminate / unchecked). */
  function tmUpdateSelectAll() {
    var allCb = document.getElementById('tmSelectAll');
    if (!allCb) return;
    var total   = tmState.sorted.length;
    var checked = tmState.sorted.filter(function(r) { return !!tmState.selected[r.clientName]; }).length;
    allCb.indeterminate = checked > 0 && checked < total;
    allCb.checked       = total > 0 && checked === total;
  }

  /** Updates the Refresh Selected button label and enabled state. */
  function tmUpdateRefreshSelectedBtn() {
    var names = tmGetSelectedNames();
    var btn   = document.getElementById('tmRefreshSelectedBtn');
    if (btn) {
      btn.disabled    = names.length === 0;
      btn.textContent = names.length > 0 ? 'Refresh Selected (' + names.length + ')' : 'Refresh Selected';
    }
  }

  /** Returns the array of currently selected client names. */
  function tmGetSelectedNames() {
    return Object.keys(tmState.selected).filter(function(n) { return !!tmState.selected[n]; });
  }


  /** Builds a count badge HTML string. */
  function tmCountBadge(count, level) {
    var cls = 'tm-badge' + (level ? ' tm-badge-' + level : '');
    return '<span class="' + cls + '">' + count + '</span>';
  }

  /** Builds a progress bar + label cell. */
  function tmProgressCell(pct) {
    var colorClass = pct >= 90 ? 'high' : pct >= 70 ? 'medium' : 'low';
    return '<div class="tm-prog-wrap">' +
      '<div class="tm-prog-bar"><div class="tm-prog-fill ' + colorClass + '" style="width:' + pct + '%"></div></div>' +
      '<span class="tm-prog-label">' + pct + '%</span>' +
    '</div>';
  }

  /** Formats an ISO timestamp as "Mmm dd yyyy hh:mm AM/PM EST". */
  function tmFormatLastRefresh(isoStr) {
    if (!isoStr) return '—';
    try {
      var d = new Date(isoStr);
      // Convert to Eastern time for display
      var eastern = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var month   = months[eastern.getMonth()];
      var day     = String(eastern.getDate()).padStart(2, '0');
      var year    = eastern.getFullYear();
      var h       = eastern.getHours();
      var min     = String(eastern.getMinutes()).padStart(2, '0');
      var ampm    = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return month + ' ' + day + ' ' + year + ' ' + String(h).padStart(2, '0') + ':' + min + ' ' + ampm + ' EST';
    } catch (e) {
      return isoStr;
    }
  }

  /** Shows/hides the global loading overlay (used only for initial load). */
  function tmSetStatus(status) {
    if (status === 'loading') {
      setGlobalLoading(true);
    } else {
      setGlobalLoading(false);
    }
  }

  /**
   * Live search filter applied to the table.
   * Pass keepPage=true to preserve the current page (used during streaming refresh).
   */
  function tmApplySearch(keepPage) {
    var q = (document.getElementById('tmSearch').value || '').trim().toLowerCase();
    tmState.filtered = q
      ? tmState.allRows.filter(function(r) {
          return r.clientName.toLowerCase().indexOf(q) !== -1 ||
                 (r.frameworks || '').toLowerCase().indexOf(q) !== -1;
        })
      : tmState.allRows.slice();
    if (!keepPage) tmState.page = 1;
    tmApplySort();
  }

  var TM_SORT_LABELS = {
    clientName:       'Client',
    frameworks:       'Frameworks',
    passingTests:     'OK',
    deactivatedTests: 'Deactivated',
    outTests:         'Outstanding',
    testPct:          'Test %',
    passingDocs:      'OK',
    deactivatedDocs:  'Deactivated',
    outDocs:          'Outstanding',
    docPct:           'Doc %',
    totalOut:         'Total Outstanding',
    completedPct:     '% Completion'
  };

  /** Returns the sort value for a row + column key (handles computed columns). */
  function tmSortVal(r, col) {
    if (col === 'passingTests') return Math.max(0, (r.activeTests || 0) - (r.outTests || 0));
    if (col === 'passingDocs')  return Math.max(0, (r.activeDocs  || 0) - (r.outDocs  || 0));
    return r[col] !== undefined ? r[col] : '';
  }

  /** Sorts tmState.filtered → tmState.sorted, then re-renders. */
  function tmApplySort() {
    var col = tmState.sortCol;
    var dir = tmState.sortDir;
    var rows = tmState.filtered.slice();
    rows.sort(function(a, b) {
      var av = tmSortVal(a, col);
      var bv = tmSortVal(b, col);
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    tmState.sorted = rows;
    tmRenderStats(tmState.filtered);
    tmRenderTable();
    tmRenderPagination();
    tmUpdateSortIcons();
  }

  /** Handles a sort-header click for the TM table. */
  function tmOnHeaderClick(col) {
    if (tmState.sortCol === col) {
      tmState.sortDir = tmState.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      tmState.sortCol = col;
      tmState.sortDir = (col === 'clientName' || col === 'frameworks') ? 'asc' : 'desc';
    }
    tmState.page = 1;
    tmApplySort();
  }

  /** Updates sort-direction indicators on TM table headers. */
  function tmUpdateSortIcons() {
    document.querySelectorAll('.tm-table .tm-th-sort').forEach(function(th) {
      var col   = th.dataset.sort;
      var label = TM_SORT_LABELS[col] || col;
      th.textContent = label + (col === tmState.sortCol ? (tmState.sortDir === 'asc' ? ' ▲' : ' ▼') : '');
      th.classList.toggle('tm-th-sort-active', col === tmState.sortCol);
    });
  }

  /** Renders pagination controls below the TM table. */
  function tmRenderPagination() {
    var el = document.getElementById('tmPagination');
    if (!el) return;
    var total      = tmState.sorted.length;
    var ps         = tmState.pageSize;
    var totalPages = ps === 0 ? 1 : Math.ceil(total / ps);
    var curPage    = tmState.page;

    if (total === 0) { el.innerHTML = ''; return; }

    var start = ps === 0 ? 1 : (curPage - 1) * ps + 1;
    var end   = ps === 0 ? total : Math.min(curPage * ps, total);

    el.innerHTML =
      '<div class="tm-page-info">' + start + '–' + end + ' of ' + total + ' clients</div>' +
      '<div class="tm-page-controls">' +
        '<select id="tmPageSize" class="tm-page-size">' +
          '<option value="20"' + (ps ===  20 ? ' selected' : '') + '>20 per page</option>' +
          '<option value="50"' + (ps ===  50 ? ' selected' : '') + '>50 per page</option>' +
          '<option value="100"'+ (ps === 100 ? ' selected' : '') + '>100 per page</option>' +
          '<option value="0"'  + (ps ===   0 ? ' selected' : '') + '>All</option>' +
        '</select>' +
        '<button class="ghost-btn tm-page-btn" id="tmPagePrev"' + (curPage <= 1 ? ' disabled' : '') + '>&#8592;</button>' +
        '<span class="tm-page-num">Page ' + curPage + ' of ' + totalPages + '</span>' +
        '<button class="ghost-btn tm-page-btn" id="tmPageNext"' + (curPage >= totalPages ? ' disabled' : '') + '>&#8594;</button>' +
      '</div>';

    document.getElementById('tmPageSize').addEventListener('change', function() {
      tmState.pageSize = parseInt(this.value);
      tmState.page = 1;
      tmRenderTable();
      tmRenderPagination();
    });
    document.getElementById('tmPagePrev').addEventListener('click', function() {
      if (tmState.page > 1) { tmState.page--; tmRenderTable(); tmRenderPagination(); }
    });
    document.getElementById('tmPageNext').addEventListener('click', function() {
      var tp = tmState.pageSize === 0 ? 1 : Math.ceil(tmState.sorted.length / tmState.pageSize);
      if (tmState.page < tp) { tmState.page++; tmRenderTable(); tmRenderPagination(); }
    });
  }

  // Hook into the module activation system
  var _origSetActiveModule = setActiveModule;
  setActiveModule = function(moduleId, label) {
    _origSetActiveModule(moduleId, label);
    if (moduleId === 'test-monitoring') {
      tmInit();
    }
    if (moduleId === 'client-management') {
      cmInit();
    }
    if (moduleId === 'control-mapping') {
      if (typeof fdmDbLoad === 'function') fdmDbLoad();
      var fdmSel = document.getElementById('fdmClientSelect');
      if (state.workingClient && fdmSel) {
        var opt = Array.from(fdmSel.options).find(function(o) { return o.value === state.workingClient; });
        if (opt) { fdmSel.value = state.workingClient; if (typeof fdmOnClientChange === 'function') fdmOnClientChange(); }
      }
    }
    if (moduleId === 'trustops-v2a' && state.workingClient) {
      var toSel = document.getElementById('clientSelect');
      if (toSel) {
        var o = Array.from(toSel.options).find(function(opt) { return opt.value === state.workingClient; });
        if (o) { toSel.value = state.workingClient; onClientChange(); }
      }
    }
    if (moduleId === 'vendor-risk' && state.workingClient) {
      var vrSel = document.getElementById('vrClientSelect');
      if (vrSel) {
        var o = Array.from(vrSel.options).find(function(opt) { return opt.value === state.workingClient; });
        if (o) vrSel.value = state.workingClient;
      }
    }
  };

  var _origBindEvents = bindEvents;
  bindEvents = function() {
    _origBindEvents();
    document.getElementById('tmRefreshBtn').addEventListener('click', tmRefreshAll);
    document.getElementById('tmRefreshSelectedBtn').addEventListener('click', tmRefreshSelected);
    document.getElementById('tmSelectAll').addEventListener('change', tmOnSelectAllChange);
    document.getElementById('tmSearch').addEventListener('input', tmApplySearch);
    document.getElementById('cmRefreshBtn').addEventListener('click', cmLoadClients);
    var auditLogBtn = document.getElementById('cmViewAuditLogBtn');
    if (auditLogBtn) auditLogBtn.addEventListener('click', cmShowAuditLog);
    var auditLogClose = document.getElementById('cmAuditLogCloseBtn');
    if (auditLogClose) auditLogClose.addEventListener('click', function() {
      document.getElementById('cmAuditLogPanel').style.display = 'none';
    });
    document.getElementById('cmSearch').addEventListener('input', cmApplyFilter);
    document.querySelectorAll('.cm-filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { cmSetFilter(btn.dataset.filter); });
    });
    // TM column sort headers
    document.querySelectorAll('.tm-table .tm-th-sort').forEach(function(th) {
      th.addEventListener('click', function() { tmOnHeaderClick(th.dataset.sort); });
    });
    // CM column sort headers
    document.querySelectorAll('.cm-table .tm-th-sort').forEach(function(th) {
      th.addEventListener('click', function() { cmOnHeaderClick(th.dataset.sortCm); });
    });
    // Close CM framework dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (cmFxOpenSid) {
        var wrap = document.getElementById('cmf-fw-wrap-' + cmFxOpenSid);
        if (wrap && !wrap.contains(e.target)) {
          cmFxCloseAll();
        }
      }
    });
  };

  // ── End Test Monitoring ──────────────────────────────────────────────────────

  // ── Client Management ────────────────────────────────────────────────────────

  var cmState = {
    loaded:       false,
    allClients:   [],
    filtered:     [],  // after status filter + search
    sorted:       [],  // after sort (pre-pagination)
    activeFilter: 'all',
    sortCol:      'clientName',
    sortDir:      'asc',
    page:         1,
    pageSize:     20
  };

  // Per-client framework cache: { [clientName]: { loaded, loading, frameworks: [{id, name}] } }
  var cmFxState  = {};
  var cmFxOpenSid = null;

  function cmInit() {
    if (cmState.loaded) return;
    cmLoadClients();
  }

  function cmLoadClients() {
    var tbody = document.getElementById('cmTableBody');
    tbody.innerHTML = '<tr><td colspan="6" class="tm-empty-cell">Loading\u2026</td></tr>';
    google.script.run
      .withSuccessHandler(function(clients) {
        cmState.allClients = clients || [];
        cmState.loaded     = true;
        cmApplyFilter();
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="6" class="tm-empty-cell" style="color:var(--danger)">Error loading clients: ' + cmEsc(err.message || String(err)) + '</td></tr>';
      })
      .CM_getAllClientsWithMetadata();
  }

  function cmShowAuditLog() {
    var panel = document.getElementById('cmAuditLogPanel');
    var tbody = document.getElementById('cmAuditLogBody');
    if (!panel || !tbody) return;
    panel.style.display = '';
    tbody.innerHTML = '<tr><td colspan="4" class="tm-empty-cell">Loading\u2026</td></tr>';
    google.script.run
      .withSuccessHandler(function(rows) {
        if (!rows || !rows.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="tm-empty-cell">No audit entries yet.</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(function(r) {
          return '<tr><td>' + escapeHtml(r.timestamp) + '</td><td>' + escapeHtml(r.user) + '</td><td>' + escapeHtml(r.action) + '</td><td>' + escapeHtml(r.context) + '</td></tr>';
        }).join('');
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="4" class="tm-empty-cell" style="color:var(--danger)">' + escapeHtml(err && err.message ? err.message : String(err)) + '</td></tr>';
      })
      .WD_getAuditLog(100);
  }

  function cmSetFilter(filter) {
    cmState.activeFilter = filter;
    document.querySelectorAll('.cm-filter-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    cmApplyFilter();
  }

  function cmApplyFilter() {
    var filter = cmState.activeFilter;
    var q      = (document.getElementById('cmSearch') ? document.getElementById('cmSearch').value : '').trim().toLowerCase();
    cmState.filtered = cmState.allClients.filter(function(c) {
      var status = (c.clientStatus || 'Active').toLowerCase();
      var matchF = filter === 'all'
        || (filter === 'active'   && status === 'active')
        || (filter === 'inactive' && status === 'inactive');
      var matchQ = !q
        || c.clientName.toLowerCase().indexOf(q) !== -1
        || (c.opsLead || '').toLowerCase().indexOf(q) !== -1
        || (c.frameworks || '').toLowerCase().indexOf(q) !== -1;
      return matchF && matchQ;
    });
    cmState.page = 1;
    cmApplySort();
  }

  function cmRenderTable() {
    var tbody = document.getElementById('cmTableBody');

    var allSorted = cmState.sorted;
    var pageRows;
    if (cmState.pageSize === 0) {
      pageRows = allSorted;
    } else {
      var start = (cmState.page - 1) * cmState.pageSize;
      pageRows = allSorted.slice(start, start + cmState.pageSize);
    }

    if (!pageRows.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="tm-empty-cell">No clients found.</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    pageRows.forEach(function(c) {
      var sid      = cmSafeId(c.clientName);
      var isActive = (c.clientStatus || 'Active').toLowerCase() !== 'inactive';

      // Data row
      var dataRow      = document.createElement('tr');
      dataRow.className = 'cm-data-row';
      dataRow.dataset.client = c.clientName;
      dataRow.innerHTML = [
        '<td class="cm-client-name">' + cmEsc(c.clientName) + '</td>',
        '<td><span class="cm-status-badge cm-status-' + (isActive ? 'active' : 'inactive') + '">' + (isActive ? 'Active' : 'Inactive') + '</span></td>',
        '<td>' + (c.clientType ? cmEsc(c.clientType) : '<span class="muted">\u2014</span>') + '</td>',
        '<td>' + (c.opsLead    ? cmEsc(c.opsLead)    : '<span class="muted">\u2014</span>') + '</td>',
        '<td>' + (c.frameworks ? '<span class="tm-fw-badge">' + cmEsc(c.frameworks) + '</span>' : '<span class="muted">\u2014</span>') + '</td>',
        '<td class="cm-actions-cell"><button class="ghost-btn cm-edit-btn" type="button">Edit</button></td>'
      ].join('');
      dataRow.querySelector('.cm-edit-btn').addEventListener('click', function() { cmToggleEdit(c.clientName); });

      // Edit row
      var editRow      = document.createElement('tr');
      editRow.className = 'cm-edit-row';
      editRow.id        = 'cm-edit-' + sid;
      editRow.style.display = 'none';
      var editCell      = document.createElement('td');
      editCell.colSpan  = 6;
      editCell.className = 'cm-edit-cell';
      editCell.appendChild(cmBuildEditForm(c));
      editRow.appendChild(editCell);

      tbody.appendChild(dataRow);
      tbody.appendChild(editRow);
    });
  }

  function cmBuildEditForm(c) {
    var sid      = cmSafeId(c.clientName);
    var isActive = (c.clientStatus || 'Active').toLowerCase() !== 'inactive';
    var form     = document.createElement('div');
    form.className = 'cm-form';
    form.id        = 'cm-form-' + sid;
    form.innerHTML = [
      '<div class="cm-form-grid">',
        '<div class="field"><label>Status</label>',
          '<select id="cmf-status-' + sid + '">',
            '<option value="Active"'   + ( isActive ? ' selected' : '') + '>Active</option>',
            '<option value="Inactive"' + (!isActive ? ' selected' : '') + '>Inactive</option>',
          '</select></div>',
        '<div class="field"><label>Client Type</label>',
          '<select id="cmf-clientType-' + sid + '">',
            '<option value="">Select\u2026</option>',
            '<option value="SPRINT"'     + (c.clientType === 'SPRINT'     ? ' selected' : '') + '>SPRINT</option>',
            '<option value="Engagement"' + (c.clientType === 'Engagement' ? ' selected' : '') + '>Engagement</option>',
          '</select></div>',
        '<div class="field"><label>Ops Lead</label>',
          '<input id="cmf-opsLead-' + sid + '" type="text" value="' + cmEsc(c.opsLead || '') + '" placeholder="Name\u2026" /></div>',
        '<div class="field"><label>Frameworks</label>',
          '<input type="hidden" id="cmf-frameworks-hidden-' + sid + '" value="' + cmEsc(c.frameworks || '') + '" />',
          '<div class="ms-wrap" id="cmf-fw-wrap-' + sid + '">',
            '<button type="button" class="ms-trigger" id="cmf-fw-trigger-' + sid + '">',
              '<span id="cmf-fw-text-' + sid + '">' + cmEsc(c.frameworks || 'Select frameworks\u2026') + '</span>',
              '<span class="ms-caret">&#9662;</span>',
            '</button>',
            '<div class="ms-dropdown" id="cmf-fw-dropdown-' + sid + '">',
