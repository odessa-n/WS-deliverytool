  function cmToggleEdit(clientName) {
    var sid     = cmSafeId(clientName);
    var editRow = document.getElementById('cm-edit-' + sid);
    if (!editRow) return;
    var isOpen  = editRow.style.display !== 'none';
    // Close all open edit rows first
    document.querySelectorAll('.cm-edit-row').forEach(function(r) { r.style.display = 'none'; });
    document.querySelectorAll('.cm-edit-btn').forEach(function(b) { b.classList.remove('active'); });
    if (!isOpen) {
      editRow.style.display = '';
      // Mark the button in the corresponding data row
      document.querySelectorAll('.cm-data-row').forEach(function(r) {
        if (r.dataset.client === clientName) {
          var btn = r.querySelector('.cm-edit-btn');
          if (btn) btn.classList.add('active');
        }
      });
    }
  }

  function cmCancelEdit(clientName) {
    var sid     = cmSafeId(clientName);
    var editRow = document.getElementById('cm-edit-' + sid);
    if (editRow) editRow.style.display = 'none';
    document.querySelectorAll('.cm-edit-btn').forEach(function(b) { b.classList.remove('active'); });
  }

  function cmSave(clientName) {
    var sid      = cmSafeId(clientName);
    var statusEl = document.getElementById('cm-save-status-' + sid);
    var planLink = document.getElementById('cmf-projectPlanLink-' + sid) ? document.getElementById('cmf-projectPlanLink-' + sid).value : '';
    var evidenceLink = document.getElementById('cmf-evidenceDropLink-' + sid) ? document.getElementById('cmf-evidenceDropLink-' + sid).value : '';
    if (!isValidUrl(planLink)) {
      if (statusEl) statusEl.textContent = 'Invalid Project Plan Link URL.';
      showToast('error', 'Please enter a valid URL for Project Plan Link.');
      return;
    }
    if (!isValidUrl(evidenceLink)) {
      if (statusEl) statusEl.textContent = 'Invalid Evidence Drop Link URL.';
      showToast('error', 'Please enter a valid URL for Evidence Drop Folder Link.');
      return;
    }
    if (statusEl) statusEl.textContent = 'Saving\u2026';

    var payload = {
      clientName:      clientName,
      clientStatus:    document.getElementById('cmf-status-'           + sid).value,
      clientType:      document.getElementById('cmf-clientType-'       + sid).value,
      opsLead:         document.getElementById('cmf-opsLead-'          + sid).value,
      frameworks:      cmFxGetSelected(sid),
      projectPlanLink: planLink,
      evidenceDropLink:evidenceLink,
      cloudSecIncluded:document.getElementById('cmf-cloudSec-'         + sid).checked
    };

    google.script.run
      .withSuccessHandler(function() {
        // Update local state so table re-renders correctly without a full reload
        for (var i = 0; i < cmState.allClients.length; i++) {
          if (cmState.allClients[i].clientName === clientName) {
            cmState.allClients[i].clientStatus    = payload.clientStatus;
            cmState.allClients[i].clientType      = payload.clientType;
            cmState.allClients[i].opsLead         = payload.opsLead;
            cmState.allClients[i].frameworks      = payload.frameworks;
            cmState.allClients[i].projectPlanLink = payload.projectPlanLink;
            cmState.allClients[i].evidenceDropLink= payload.evidenceDropLink;
            cmState.allClients[i].cloudSecIncluded= payload.cloudSecIncluded;
            break;
          }
        }
        if (statusEl) statusEl.textContent = 'Saved!';
        setTimeout(function() {
          cmCancelEdit(clientName);
          cmApplyFilter();
        }, 700);
      })
      .withFailureHandler(function(err) {
        if (statusEl) statusEl.textContent = 'Error: ' + cmEsc(err.message || String(err));
      })
      .CM_saveClientData(payload);
  }

  // ── CM Sort + Pagination ──────────────────────────────────────────────────────

  var CM_SORT_LABELS = {
    clientName:   'Client',
    clientStatus: 'Status',
    clientType:   'Client Type',
    opsLead:      'Ops Lead',
    frameworks:   'Frameworks'
  };

  /** Sorts cmState.filtered → cmState.sorted, then re-renders. */
  function cmApplySort() {
    var col = cmState.sortCol;
    var dir = cmState.sortDir;
    var rows = cmState.filtered.slice();
    rows.sort(function(a, b) {
      var av = (a[col] || '').toString().toLowerCase();
      var bv = (b[col] || '').toString().toLowerCase();
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    cmState.sorted = rows;
    cmRenderTable();
    cmRenderPagination();
    cmUpdateSortIcons();
  }

  /** Handles a sort-header click for the CM table. */
  function cmOnHeaderClick(col) {
    if (cmState.sortCol === col) {
      cmState.sortDir = cmState.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      cmState.sortCol = col;
      cmState.sortDir = 'asc';
    }
    cmState.page = 1;
    cmApplySort();
  }

  /** Updates sort-direction indicators on CM table headers. */
  function cmUpdateSortIcons() {
    document.querySelectorAll('.cm-table .tm-th-sort').forEach(function(th) {
      var col   = th.dataset.sortCm;
      var label = CM_SORT_LABELS[col] || col;
      th.textContent = label + (col === cmState.sortCol ? (cmState.sortDir === 'asc' ? ' ▲' : ' ▼') : '');
      th.classList.toggle('tm-th-sort-active', col === cmState.sortCol);
    });
  }

  /** Renders pagination controls below the CM table. */
  function cmRenderPagination() {
    var el = document.getElementById('cmPagination');
    if (!el) return;
    var total      = cmState.sorted.length;
    var ps         = cmState.pageSize;
    var totalPages = ps === 0 ? 1 : Math.ceil(total / ps);
    var curPage    = cmState.page;

    if (total === 0) { el.innerHTML = ''; return; }

    var start = ps === 0 ? 1 : (curPage - 1) * ps + 1;
    var end   = ps === 0 ? total : Math.min(curPage * ps, total);

    el.innerHTML =
      '<div class="tm-page-info">' + start + '–' + end + ' of ' + total + ' clients</div>' +
      '<div class="tm-page-controls">' +
        '<select id="cmPageSize" class="tm-page-size">' +
          '<option value="20"' + (ps ===  20 ? ' selected' : '') + '>20 per page</option>' +
          '<option value="50"' + (ps ===  50 ? ' selected' : '') + '>50 per page</option>' +
          '<option value="100"'+ (ps === 100 ? ' selected' : '') + '>100 per page</option>' +
          '<option value="0"'  + (ps ===   0 ? ' selected' : '') + '>All</option>' +
        '</select>' +
        '<button class="ghost-btn tm-page-btn" id="cmPagePrev"' + (curPage <= 1 ? ' disabled' : '') + '>&#8592;</button>' +
        '<span class="tm-page-num">Page ' + curPage + ' of ' + totalPages + '</span>' +
        '<button class="ghost-btn tm-page-btn" id="cmPageNext"' + (curPage >= totalPages ? ' disabled' : '') + '>&#8594;</button>' +
      '</div>';

    document.getElementById('cmPageSize').addEventListener('change', function() {
      cmState.pageSize = parseInt(this.value);
      cmState.page = 1;
      cmRenderTable();
      cmRenderPagination();
    });
    document.getElementById('cmPagePrev').addEventListener('click', function() {
      if (cmState.page > 1) { cmState.page--; cmRenderTable(); cmRenderPagination(); }
    });
    document.getElementById('cmPageNext').addEventListener('click', function() {
      var tp = cmState.pageSize === 0 ? 1 : Math.ceil(cmState.sorted.length / cmState.pageSize);
      if (cmState.page < tp) { cmState.page++; cmRenderTable(); cmRenderPagination(); }
    });
  }

  // ── CM Framework multi-select helpers ────────────────────────────────────────

  function cmFxToggleDropdown(clientName, sid) {
    var dropdown = document.getElementById('cmf-fw-dropdown-' + sid);
    var trigger  = document.getElementById('cmf-fw-trigger-'  + sid);
    if (!dropdown) return;
    var isOpen = dropdown.classList.contains('open');

    cmFxCloseAll();

    if (!isOpen) {
      var st = cmFxState[clientName];
      if (!st || (!st.loaded && !st.loading)) {
        cmFxFetchFrameworks(clientName, sid);
      } else if (st.loaded) {
        cmFxRenderOptions(clientName, sid);
      }
      if (trigger)  trigger.classList.add('open');
      if (dropdown) dropdown.classList.add('open');
      cmFxOpenSid = sid;
    }
  }

  function cmFxCloseAll() {
    document.querySelectorAll('.cm-form .ms-trigger.open').forEach(function(t)  { t.classList.remove('open'); });
    document.querySelectorAll('.cm-form .ms-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
    cmFxOpenSid = null;
  }

  function cmFxFetchFrameworks(clientName, sid) {
    if (!cmFxState[clientName]) cmFxState[clientName] = { loaded: false, loading: false, frameworks: [] };
    cmFxState[clientName].loading = true;

    var optionsEl = document.getElementById('cmf-fw-options-' + sid);
    if (optionsEl) optionsEl.innerHTML = '<div class="ms-empty">Loading frameworks\u2026</div>';

    var trigger  = document.getElementById('cmf-fw-trigger-'  + sid);
    var dropdown = document.getElementById('cmf-fw-dropdown-' + sid);
    if (trigger)  trigger.classList.add('open');
    if (dropdown) dropdown.classList.add('open');
    cmFxOpenSid = sid;

    google.script.run
      .withSuccessHandler(function(frameworks) {
        cmFxState[clientName].frameworks = frameworks || [];
        cmFxState[clientName].loaded     = true;
        cmFxState[clientName].loading    = false;
        cmFxRenderOptions(clientName, sid);
      })
      .withFailureHandler(function(err) {
        cmFxState[clientName].loading = false;
        if (optionsEl) optionsEl.innerHTML = '<div class="ms-empty">Error loading frameworks.</div>';
      })
      .WD_getFrameworks(clientName);
  }

  function cmFxRenderOptions(clientName, sid) {
    var optionsEl = document.getElementById('cmf-fw-options-' + sid);
    if (!optionsEl) return;

    var frameworks = (cmFxState[clientName] && cmFxState[clientName].frameworks) || [];
    if (!frameworks.length) {
      optionsEl.innerHTML = '<div class="ms-empty">No frameworks found.</div>';
      return;
    }

    // Build stored names set from hidden input (fallback) or current label text
    var hiddenEl    = document.getElementById('cmf-frameworks-hidden-' + sid);
    var storedRaw   = hiddenEl ? hiddenEl.value : '';
    var storedSet   = {};
    storedRaw.split(',').forEach(function(n) {
      var t = n.trim().toLowerCase();
      if (t) storedSet[t] = true;
    });

    optionsEl.innerHTML = '';
    frameworks.forEach(function(fw) {
      var isChecked = !!storedSet[fw.name.trim().toLowerCase()];
      var label = document.createElement('label');
      label.className = 'ms-option';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = fw.id;
      cb.dataset.name = fw.name;
      cb.checked = isChecked;
      cb.addEventListener('change', function() { cmFxUpdateLabel(sid); });
      var span = document.createElement('span');
      span.className = 'ms-option-label';
      span.textContent = fw.name;
      label.appendChild(cb);
      label.appendChild(span);
      optionsEl.appendChild(label);
    });

    cmFxUpdateLabel(sid);
  }

  function cmFxUpdateLabel(sid) {
    var optionsEl  = document.getElementById('cmf-fw-options-' + sid);
    var textEl     = document.getElementById('cmf-fw-text-'    + sid);
    if (!optionsEl || !textEl) return;
    var checked = Array.from(optionsEl.querySelectorAll('input[type="checkbox"]:checked'));
    textEl.textContent = checked.length
      ? checked.map(function(cb) { return cb.dataset.name; }).join(', ')
      : 'All frameworks (no filter)';
  }

  /** Returns comma-joined selected framework names, or stored value if dropdown was never opened. */
  function cmFxGetSelected(sid) {
    var optionsEl = document.getElementById('cmf-fw-options-' + sid);
    var checkboxes = optionsEl ? optionsEl.querySelectorAll('input[type="checkbox"]') : [];
    if (!checkboxes.length) {
      // Dropdown was never opened — preserve the stored value
      var hidden = document.getElementById('cmf-frameworks-hidden-' + sid);
      return hidden ? hidden.value : '';
    }
    var names = [];
    checkboxes.forEach(function(cb) { if (cb.checked) names.push(cb.dataset.name); });
    return names.join(', ');
  }

  function cmSafeId(name) {
    return String(name).replace(/[^a-zA-Z0-9]/g, '_');
  }

  function cmEsc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var vrState = {

  function vrInit() {
    document.getElementById('vrRefreshClientsBtn').addEventListener('click', loadClients);
    document.getElementById('vrLoadBtn').addEventListener('click', vrLoadVendors);
    document.getElementById('vrUploadCancelBtn').addEventListener('click', vrCloseUploadDrawer);
    document.getElementById('vrUploadSubmitBtn').addEventListener('click', function() { vrSubmitUpload(false); });
    document.getElementById('vrUploadReviewSubmitBtn').addEventListener('click', function() { vrSubmitUpload(true); });
    document.getElementById('vrAutoUploadBtn').addEventListener('click', vrAutoUpload);
    var sel = document.getElementById('vrClientSelect');

    if (state.clients && state.clients.length > 0) {
      vrState.clients = state.clients;
      sel.innerHTML = '<option value="">Select a client...</option>';
      state.clients.forEach(function(c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
    } else {
      loadClients();
    }
  }

  function vrLoadClients() {
    loadClients();
  }

  function vrLoadVendors() {
    var clientName = document.getElementById('vrClientSelect').value;
    state.workingClient = clientName || null;
    var riskFilter = document.getElementById('vrRiskFilter').value;
    if (!clientName) { vrShowStatus('Please select a client first.', 'warn'); return; }

    vrState.clientName = clientName;
    vrShowStatus('Loading vendors for ' + clientName + '...', 'info');
    document.getElementById('vrTableWrap').style.display = 'none';
    document.getElementById('vrSummary').style.display = 'none';

    google.script.run
      .withSuccessHandler(vrRenderDashboard)
      .withFailureHandler(function(err) {
        vrShowStatus('Error: ' + (err.message || String(err)), 'error');
      })
      .WD_getVendorDashboard({ clientName: clientName, riskFilter: riskFilter });
  }

  function vrRenderDashboard(data) {
    vrState.vendors = data.vendors || [];
    var vendors = vrState.vendors;

    // Summary stats
    var current = vendors.filter(function(v) { return v.reviewStatus === 'Current'; }).length;
    var needsReview = data.needsReview || 0;
    document.getElementById('vrStatTotalNum').textContent = data.total || 0;
    document.getElementById('vrStatNeedsReview').textContent = needsReview;
    document.getElementById('vrStatCurrent').textContent = current;
    document.getElementById('vrSummary').style.display = '';

    // Show/hide auto-upload button
    var autoBtn = document.getElementById('vrAutoUploadBtn');
    autoBtn.style.display = needsReview > 0 ? '' : 'none';

    // Table label
    document.getElementById('vrTableLabel').textContent =
      vendors.length + ' vendor' + (vendors.length !== 1 ? 's' : '') +
      ' · ' + data.clientName + ' · fetched ' + vrFmtTime(data.fetchedAt);

    // Render rows
    var tbody = document.getElementById('vrTableBody');
    tbody.innerHTML = '';

    if (!vendors.length) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="7" style="text-align:center;color:var(--muted,#888);padding:24px;">No vendors found for this filter.</td>';
      tbody.appendChild(tr);
    } else {
      vendors.forEach(function(v) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + vrEsc(v.name) + '</strong>' +
            (v.url ? '<br><span style="font-size:11px;color:var(--muted,#888);">' + vrEsc(v.url) + '</span>' : '') +
          '</td>' +
          '<td>' + vrEsc(v.category || '—') + '</td>' +
          '<td>' + vrRiskBadge(v.riskLevel) + '</td>' +
          '<td>' + vrEsc(v.status || '—') + '</td>' +
          '<td>' + vrFmtDate(v.latestReviewDate) + '</td>' +
          '<td>' + vrStatusLabel(v.reviewStatus) + '</td>' +
          '<td><button class="vr-action-btn" onclick="vrOpenUploadDrawer(' +
            JSON.stringify(v.id) + ',' + JSON.stringify(v.name) + ',' +
            JSON.stringify(v.reviews && v.reviews.length ? v.reviews[0].id : '') +
          ')">Upload Doc</button></td>';
        tbody.appendChild(tr);
      });
    }

    document.getElementById('vrTableWrap').style.display = '';
    document.getElementById('vrStatus').style.display = 'none';
  }

  function vrRiskBadge(level) {
    var cls = {
      Critical: 'vr-badge-critical',
      High:     'vr-badge-high',
      Medium:   'vr-badge-medium',
      Low:      'vr-badge-low'
    }[level] || 'vr-badge-unknown';
    return '<span class="vr-badge ' + cls + '">' + vrEsc(level || 'Unknown') + '</span>';
  }

  function vrStatusLabel(status) {
    var cls = {
      'Current':        'vr-status-current',
      'Due Soon':       'vr-status-soon',
      'Overdue':        'vr-status-overdue',
      'Never Reviewed': 'vr-status-never'
    }[status] || '';
    return '<span class="' + cls + '">' + vrEsc(status || '—') + '</span>';
  }

  function vrOpenUploadDrawer(vendorId, vendorName, latestReviewId) {
    document.getElementById('vrUploadVendorId').value   = vendorId || '';
    document.getElementById('vrUploadReviewId').value   = latestReviewId || '';
    document.getElementById('vrUploadVendorName').value = vendorName || '';
    document.getElementById('vrUploadTitle').value      = '';
    document.getElementById('vrUploadFileId').value     = '';
    document.getElementById('vrUploadStatus').style.display = 'none';

    var reviewBtn = document.getElementById('vrUploadReviewSubmitBtn');
    reviewBtn.style.display = latestReviewId ? '' : 'none';

    var drawer = document.getElementById('vrUploadDrawer');

  function vrCloseUploadDrawer() {

  function vrSubmitUpload(toReview) {
    var vendorId      = document.getElementById('vrUploadVendorId').value;
    var reviewId      = document.getElementById('vrUploadReviewId').value;
    var documentTitle = document.getElementById('vrUploadTitle').value.trim();
    var driveFileId   = document.getElementById('vrUploadFileId').value.trim();
    var documentType  = document.getElementById('vrUploadDocType').value;
    var statusEl      = document.getElementById('vrUploadStatus');

    if (!documentTitle) { vrUploadMsg('Document title is required.', 'error'); return; }
    if (!driveFileId)   { vrUploadMsg('Drive file ID is required.', 'error'); return; }

    vrUploadMsg('Uploading...', 'info');

    var fn = toReview ? 'WD_uploadDocumentToReview' : 'WD_uploadDocumentToVendor';
    var payload = {
      clientName:    vrState.clientName,
      vendorId:      vendorId,
      driveFileId:   driveFileId,
      documentTitle: documentTitle,
      documentType:  documentType
    };
    if (toReview) payload.securityReviewId = reviewId;

    google.script.run
      .withSuccessHandler(function(result) {
        vrUploadMsg('Uploaded successfully.', 'success');
      })
      .withFailureHandler(function(err) {
        vrUploadMsg('Upload failed: ' + (err.message || String(err)), 'error');
      })
      [fn](payload);
  }

  function vrAutoUpload() {
    if (!vrState.clientName) return;
    vrShowStatus('Auto-uploading docs for overdue Critical/High vendors...', 'info');

    google.script.run
      .withSuccessHandler(function(result) {
        var msg = 'Auto-upload complete. Uploaded: ' + result.uploaded.length +
          ', Skipped: ' + result.skipped.length +
          ', Errors: ' + result.errors.length + '.';
        if (result.errors.length) {
          msg += ' Errors: ' + result.errors.map(function(e) { return e.vendorName + ' — ' + e.error; }).join('; ');
        }
        vrShowStatus(msg, result.errors.length ? 'warn' : 'success');
      })
      .withFailureHandler(function(err) {
        vrShowStatus('Auto-upload failed: ' + (err.message || String(err)), 'error');
      })
      .WD_autoUploadVendorDocs({ clientName: vrState.clientName, onlyOverdue: true });
  }

  function vrShowStatus(msg, type) {
    var el = document.getElementById('vrStatus');
    el.textContent = msg;
    el.style.display = '';
    el.style.background = type === 'error'   ? '#fde8e8' :
                          type === 'warn'    ? '#fff3cd' :
                          type === 'success' ? '#d4edda' : '';
    el.style.color      = type === 'error'   ? '#b54747' :
                          type === 'warn'    ? '#856404' :
                          type === 'success' ? '#155724' : '';
  }

  function vrUploadMsg(msg, type) {
    var el = document.getElementById('vrUploadStatus');
    el.textContent = msg;
    el.style.display = '';
    el.style.color = type === 'error' ? '#b54747' : type === 'success' ? '#155724' : '';
  }

  function vrFmtDate(iso) {
    if (!iso) return '<span style="color:var(--muted,#888);">—</span>';
    try {
      var d = new Date(iso);
      if (isNaN(d)) return vrEsc(iso);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    } catch(e) { return vrEsc(iso); }
  }

  function vrFmtTime(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    } catch(e) { return ''; }
  }

  function vrEsc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

    state.workingClient = client || null;
    fdmState.clientName       = client;
    fdmState.frameworkId      = null;
    fdmState.frameworks       = [];
    fdmState.frameworksLoaded = false;
    fdmState.data             = null;

    var fwSel   = document.getElementById('fdmFrameworkSelect');
    var loadBtn = document.getElementById('fdmLoadBtn');
    fwSel.innerHTML = '<option value="">Loading frameworks\u2026</option>';
    fwSel.disabled  = true;
    loadBtn.disabled = true;

    document.getElementById('fdm-statusBadge').textContent = 'idle';
    document.getElementById('fdm-resultBadge').textContent = '—';
    document.getElementById('fdm-cache-info').style.display = 'none';
    fdmSetResults('<div class="fdm-empty">Loading frameworks\u2026</div>');

    if (!client) {
      fwSel.innerHTML = '<option value="">Select a client first</option>';
      fdmSetResults('<div class="fdm-empty">Select a client and framework to load the mapping.</div>');
      return;
    }

    google.script.run
      .withSuccessHandler(function(frameworks) {
        fdmState.frameworks       = frameworks || [];
        fdmState.frameworksLoaded = true;
        fdmRenderFrameworkSelect();
        fdmSetResults('<div class="fdm-empty">Select a framework to load the mapping.</div>');
      })
      .withFailureHandler(function(err) {
        fwSel.innerHTML = '<option value="">Error loading frameworks</option>';
        showError(err);
      })
      .WD_getFrameworks(client);
  }

  function fdmRenderFrameworkSelect() {
    var fwSel = document.getElementById('fdmFrameworkSelect');
    if (!fwSel) return;
    fwSel.innerHTML = '<option value="">Select Framework</option>';
    fdmState.frameworks.forEach(function(fw) {
      var opt = document.createElement('option');
      opt.value       = fw.id;
      opt.textContent = fw.name;
      fwSel.appendChild(opt);
    });
    fwSel.disabled = false;
    var loadBtn = document.getElementById('fdmLoadBtn');
    if (loadBtn) loadBtn.disabled = false;
  }

  function fdmOnFrameworkChange() {
    var sel = document.getElementById('fdmFrameworkSelect');
    if (!sel) return;
    fdmState.frameworkId   = sel.value;
    fdmState.frameworkName = sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].text : '';
    fdmState.data          = null;
    document.getElementById('fdm-cache-info').style.display = 'none';
    document.getElementById('fdm-resultBadge').textContent  = '—';
    document.getElementById('fdm-statusBadge').textContent  = 'idle';

    if (fdmState.frameworkId) {
      // Auto-load on framework select
      fdmLoad();
    } else {
      fdmSetResults('<div class="fdm-empty">Select a framework to load the mapping.</div>');
    }
  }

  function fdmLoad() {
    if (!document.getElementById('fdmLoadBtn')) return;
    if (!fdmState.clientName)  { alert('Please select a client.');    return; }
    if (!fdmState.frameworkId) { alert('Please select a framework.'); return; }

    var forceEl = document.getElementById('fdmForceRefresh');
    var forceRefresh = forceEl ? forceEl.checked : false;

    fdmState.loading = true;
    var statusBadge = document.getElementById('fdm-statusBadge');
    if (statusBadge) statusBadge.textContent = 'loading\u2026';
    var loadBtn = document.getElementById('fdmLoadBtn');
    if (loadBtn) loadBtn.disabled = true;
    setGlobalLoading(true);
    fdmSetResults('<div class="fdm-empty">Loading\u2026 this may take a moment for large frameworks.</div>');

    var syncInfo = document.getElementById('fdm-sync-info');
    var syncText = document.getElementById('fdm-syncText');
    if (syncInfo) syncInfo.style.display = '';
    if (syncText) syncText.textContent = 'Syncing to FrameworkMappingDB\u2026';

    // Load map then sync DB from same data (no second API burst — avoids bandwidth quota; ensures docs get into DB)
    google.script.run
      .withSuccessHandler(function(result) {
        setGlobalLoading(false);
        fdmState.loading = false;
        fdmState.data    = result;
        var lb = document.getElementById('fdmLoadBtn');
        if (lb) lb.disabled = false;
        fdmRenderDocMap(result);
        if (syncText) syncText.textContent = 'Syncing to DB from loaded data\u2026';
        google.script.run
          .withSuccessHandler(function(syncResult) {
            if (syncText) syncText.textContent = 'DB synced \u2014 +' + syncResult.added +
              ' new, ' + syncResult.updated + ' updated';
            appendExecutionLog('Framework Mapping', true, '+' + syncResult.added + ' new, ' + syncResult.updated + ' updated');
          })
          .withFailureHandler(function(err) {
            console.warn('FrameworkMappingDB sync failed:', err);
            if (syncText) syncText.textContent = 'DB sync failed: ' +
              (err && err.message ? err.message : String(err));
            appendExecutionLog('Framework Mapping DB', false, err && err.message ? err.message : String(err));
          })
          .WD_syncFrameworkMappingDBFromDocMap({
            clientName:    fdmState.clientName,
            frameworkName: fdmState.frameworkName,
            controls:      result.controls || []
          });
      })
      .withFailureHandler(function(err) {
        setGlobalLoading(false);
        fdmState.loading = false;
        var lb = document.getElementById('fdmLoadBtn');
        if (lb) lb.disabled = false;
        var sb = document.getElementById('fdm-statusBadge');
        if (sb) sb.textContent = 'error';
        appendExecutionLog('Framework Mapping', false, err && err.message ? err.message : String(err));
        fdmSetResults('<div class="fdm-empty" style="color:var(--danger);">Error: ' +
          escapeHtml(err && err.message ? err.message : String(err)) + '</div>');
      })
      .WD_getFrameworkDocMap({
        clientName:   fdmState.clientName,
        frameworkId:  fdmState.frameworkId,
        forceRefresh: forceRefresh
      });
  }

  function fdmRenderDocMap(result) {
    var resultsEl = document.getElementById('fdm-results');
    if (!resultsEl) return;
    var controls   = result.controls || [];
    var totalTests = 0;
    var totalDocs  = 0;
    controls.forEach(function(c) {
      totalTests += (c.tests     || []).length;
      totalDocs  += (c.documents || []).length;
    });

    var resultBadge = document.getElementById('fdm-resultBadge');
    var statusBadge = document.getElementById('fdm-statusBadge');
    if (resultBadge) resultBadge.textContent = controls.length + ' controls';
    if (statusBadge) statusBadge.textContent = result.fromCache ? 'cached' : 'live';

    var cacheInfo  = document.getElementById('fdm-cache-info');
    var cacheText  = document.getElementById('fdm-cacheText');
    var cacheBadge = document.getElementById('fdm-cacheBadge');
    if (cacheInfo) { cacheInfo.style.display = ''; cacheInfo.className = 'du-status' + (result.fromCache ? '' : ' good'); }
    var timeStr = result.cachedAt ? new Date(result.cachedAt).toLocaleTimeString() : '—';
    if (cacheText) cacheText.textContent = (result.fromCache ? 'Cached result' : 'Fetched live') +
      ' \u00b7 ' + totalTests + ' test' + (totalTests !== 1 ? 's' : '') +
      ' \u00b7 ' + totalDocs  + ' doc'  + (totalDocs  !== 1 ? 's' : '');
    if (cacheBadge) cacheBadge.textContent = timeStr;

    if (!controls.length) {
      fdmSetResults('<div class="fdm-empty">No controls found for this framework.</div>');
      return;
    }

    var html = '<div class="fdm-summary">';
    html += '<span>' + controls.length + ' controls &middot; ' +
            totalTests + ' tests &middot; ' + totalDocs + ' documents</span>';
    html += '<span style="font-size:11px;">' + (result.fromCache ? 'Cached' : 'Live') +
            ' as of ' + timeStr + '</span>';
    html += '</div>';

    controls.forEach(function(ctrl, idx) {
      var tests = ctrl.tests     || [];
      var docs  = ctrl.documents || [];
      var rowId = 'fdm-ctrl-' + idx;

      html += '<div class="fdm-ctrl-row" id="' + rowId + '">';
      html += '<div class="fdm-ctrl-head" onclick="fdmToggle(\'' + rowId + '\')">';
      html += '<span class="fdm-ctrl-arrow">&#9658;</span>';
      html += '<span class="fdm-ctrl-name">' + escapeHtml(ctrl.name) + '</span>';
      if (ctrl.category) {
        html += '<span class="fdm-cat-badge">' + escapeHtml(ctrl.category) + '</span>';
      }
      html += '<span class="fdm-ctrl-meta">' +
              tests.length + ' test' + (tests.length !== 1 ? 's' : '') +
              ' &middot; ' +
              docs.length  + ' doc'  + (docs.length  !== 1 ? 's' : '') + '</span>';
      html += '</div>';

      html += '<div class="fdm-docs-list">';

      if (tests.length) {
        html += '<div class="fdm-section-label">Tests</div>';
        tests.forEach(function(test) {
          html += '<div class="fdm-doc-item">';
          html += '<span class="fdm-doc-name">' + escapeHtml(test.name) + '</span>';
          if (test.status) {
            html += '<span class="fdm-doc-type">' + escapeHtml(test.status) + '</span>';
          }
          html += '</div>';
        });
      }

      if (docs.length) {
        html += '<div class="fdm-section-label">Documents</div>';
        docs.forEach(function(doc) {
          html += '<div class="fdm-doc-item">';
          if (doc.url) {
            html += '<a href="' + escapeHtml(doc.url) + '" target="_blank">' +
                    escapeHtml(doc.name) + '</a>';
          } else {
            html += '<span class="fdm-doc-name">' + escapeHtml(doc.name) + '</span>';
          }
          if (doc.type) {
            html += '<span class="fdm-doc-type">' + escapeHtml(doc.type) + '</span>';
          }
          html += '</div>';
        });
      }

      if (!tests.length && !docs.length) {
        html += '<div class="fdm-no-docs">No tests or documents mapped to this control.</div>';
      }

      html += '</div></div>';
    });

    resultsEl.innerHTML = html;
  }

  function fdmToggle(rowId) {
    var row = document.getElementById(rowId);
    if (row) row.classList.toggle('open');
  }

  function fdmSetResults(html) {
    var el = document.getElementById('fdm-results');
    if (el) el.innerHTML = html;
  }

  function fdmReset() {
    var clientSel = document.getElementById('fdmClientSelect');
    var fwSel = document.getElementById('fdmFrameworkSelect');
    var loadBtn = document.getElementById('fdmLoadBtn');
    if (clientSel) clientSel.value = '';
    if (fwSel) {
      fwSel.innerHTML = '<option value="">Select a client first</option>';
      fwSel.disabled = true;
    }
    if (loadBtn) loadBtn.disabled = true;
    var forceEl = document.getElementById('fdmForceRefresh');
    if (forceEl) forceEl.checked = false;
    var sb = document.getElementById('fdm-statusBadge');
    var rb = document.getElementById('fdm-resultBadge');
    if (sb) sb.textContent = 'idle';
    if (rb) rb.textContent = '—';
    var cacheInfo = document.getElementById('fdm-cache-info');
    var syncInfo = document.getElementById('fdm-sync-info');
    var syncText = document.getElementById('fdm-syncText');
    if (cacheInfo) cacheInfo.style.display = 'none';
    if (syncInfo) syncInfo.style.display = 'none';
    if (syncText) syncText.textContent = '—';
    fdmState.clientName   = null;
    fdmState.frameworkId  = null;
    fdmState.frameworkName = null;
    fdmState.frameworks   = [];
    fdmState.data         = null;
    fdmSetResults('<div class="fdm-empty">Select a client and framework to load the mapping.</div>');
  }

  // ── Framework Mapping DB table (all clients) ───────────────────────────────────
  var fdmDbState = {
    rows: [],
    frameworkColumns: [],
    lastUpdated: '',
    filtered: [],
    sorted: [],
    sortCol: 'name',
    sortDir: 'asc',
    page: 1,
    pageSize: 20,
    frameworkFilter: ''
  };

  var FDMDB_SORT_LABELS = { name: 'Name', type: 'Type' };

  function fdmDbLoad() {
    document.getElementById('fdm-db-fetchAllBtn').disabled = true;
    document.getElementById('fdm-db-lastUpdated').textContent = 'Loading…';
    google.script.run
      .withSuccessHandler(function(data) {
        fdmDbState.rows = data.rows || [];
        fdmDbState.frameworkColumns = data.frameworkColumns || [];
        fdmDbState.lastUpdated = data.lastUpdated || '';
        document.getElementById('fdm-db-lastUpdated').textContent = fdmDbState.lastUpdated
          ? new Date(fdmDbState.lastUpdated).toLocaleString()
          : 'Never';
        fdmDbPopulateFrameworkFilter();
        fdmDbApplyFilter();
      })
      .withFailureHandler(function(err) {
        document.getElementById('fdm-db-lastUpdated').textContent = 'Error';
        document.getElementById('fdm-db-fetchAllBtn').disabled = false;
        showError(err);
      })
      .WD_getFrameworkMappingDBForUI();
    fdmDbPopulateClientFilter();
  }

  function fdmDbPopulateClientFilter() {
    var sel = document.getElementById('fdm-db-clientFilter');
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = '<option value="">—</option>';
    (state.clients || []).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      sel.appendChild(opt);
    });
    if (cur && state.clients && state.clients.indexOf(cur) >= 0) sel.value = cur;
  }

  function fdmDbPopulateFrameworkFilter() {
    var sel = document.getElementById('fdm-db-frameworkFilter');
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = '<option value="">All</option>';
    (fdmDbState.frameworkColumns || []).forEach(function(fw) {
      var opt = document.createElement('option');
      opt.value = fw;
      opt.textContent = fw;
      sel.appendChild(opt);
    });
    if (cur && fdmDbState.frameworkColumns && fdmDbState.frameworkColumns.indexOf(cur) >= 0) sel.value = cur;
    else fdmDbState.frameworkFilter = '';
  }

  function fdmDbApplyFilter() {
    var fw = (document.getElementById('fdm-db-frameworkFilter') && document.getElementById('fdm-db-frameworkFilter').value) || '';
    fdmDbState.frameworkFilter = fw;
    if (!fw) {
      fdmDbState.filtered = fdmDbState.rows.slice();
    } else {
      fdmDbState.filtered = fdmDbState.rows.filter(function(r) {
        return r.frameworks && r.frameworks[fw];
      });
    }
    fdmDbState.page = 1;
    fdmDbApplySort();
    document.getElementById('fdm-db-fetchAllBtn').disabled = false;
  }

  function fdmDbApplySort() {
    var col = fdmDbState.sortCol;
    var dir = fdmDbState.sortDir;
    var rows = fdmDbState.filtered.slice();
    rows.sort(function(a, b) {
      var av = col === 'name' ? (a.name || '') : (a.type || '');
      var bv = col === 'name' ? (b.name || '') : (b.type || '');
      av = String(av).toLowerCase();
      bv = String(bv).toLowerCase();
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    fdmDbState.sorted = rows;
    fdmDbRenderTable();
    fdmDbRenderPagination();
    fdmDbUpdateSortIcons();
  }

  function fdmDbOnHeaderClick(col) {
    if (fdmDbState.sortCol === col) {
      fdmDbState.sortDir = fdmDbState.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      fdmDbState.sortCol = col;
      fdmDbState.sortDir = 'asc';
    }
    fdmDbState.page = 1;
    fdmDbApplySort();
  }

  function fdmDbUpdateSortIcons() {
    var thead = document.getElementById('fdm-db-thead');
    if (!thead) return;
    thead.querySelectorAll('.fdm-db-th-sort').forEach(function(th) {
      var col = th.dataset.sort;
      var label = FDMDB_SORT_LABELS[col] || col;
      th.textContent = label + (col === fdmDbState.sortCol ? (fdmDbState.sortDir === 'asc' ? ' ▲' : ' ▼') : '');
      th.classList.toggle('tm-th-sort-active', col === fdmDbState.sortCol);
    });
  }

  function fdmDbRenderTable() {
    var thead = document.getElementById('fdm-db-thead');
    var tbody = document.getElementById('fdm-db-tbody');
    var cols = fdmDbState.frameworkColumns;
    var totalCols = 3 + (cols ? cols.length : 0);

    thead.innerHTML = '<tr>' +
      '<th>#</th>' +
      '<th class="fdm-db-th-sort tm-th-sort" data-sort="name" role="button" tabindex="0">Name</th>' +
      '<th class="fdm-db-th-sort tm-th-sort" data-sort="type" role="button" tabindex="0">Type</th>' +
      (cols || []).map(function(c) { return '<th>' + escapeHtml(c) + '</th>'; }).join('') +
      '</tr>';

    thead.querySelectorAll('.fdm-db-th-sort').forEach(function(th) {
      th.addEventListener('click', function() { fdmDbOnHeaderClick(th.dataset.sort); });
      th.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fdmDbOnHeaderClick(th.dataset.sort); }
      });
    });

    var sorted = fdmDbState.sorted;
    var ps = fdmDbState.pageSize;
    var pageRows = ps === 0 ? sorted : sorted.slice((fdmDbState.page - 1) * ps, (fdmDbState.page - 1) * ps + ps);

    if (!pageRows.length) {
      tbody.innerHTML = '<tr><td colspan="' + totalCols + '" class="fdm-db-empty">' +
        (fdmDbState.rows.length ? 'No rows match the framework filter.' : 'No rows. Load data first.') + '</td></tr>';
      return;
    }

    var startNum = (fdmDbState.page - 1) * (ps || 1) + 1;
    tbody.innerHTML = pageRows.map(function(r, idx) {
      var num = startNum + idx;
      var cells = [
        num,
        escapeHtml(r.name || ''),
        escapeHtml(r.type || '')
      ].concat((cols || []).map(function(fw) {
        return r.frameworks && r.frameworks[fw] ? '<span class="fdm-db-check">✓</span>' : '—';
      }));
      return '<tr><td>' + cells.join('</td><td>') + '</td></tr>';
    }).join('');
  }

  function fdmDbRenderPagination() {
    var el = document.getElementById('fdm-db-pagination');
    if (!el) return;
    var total = fdmDbState.sorted.length;
    var ps = fdmDbState.pageSize;
    var totalPages = ps === 0 ? 1 : Math.max(1, Math.ceil(total / ps));
    var curPage = fdmDbState.page;

    if (total === 0) { el.innerHTML = ''; return; }

    var start = ps === 0 ? 1 : (curPage - 1) * ps + 1;
    var end = ps === 0 ? total : Math.min(curPage * ps, total);

    el.innerHTML =
      '<div class="tm-page-info">' + start + '–' + end + ' of ' + total + ' rows</div>' +
      '<div class="tm-page-controls">' +
        '<select id="fdm-db-pageSize" class="tm-page-size">' +
          '<option value="20"' + (ps === 20 ? ' selected' : '') + '>20 per page</option>' +
          '<option value="50"' + (ps === 50 ? ' selected' : '') + '>50 per page</option>' +
          '<option value="100"' + (ps === 100 ? ' selected' : '') + '>100 per page</option>' +
          '<option value="0"' + (ps === 0 ? ' selected' : '') + '>All</option>' +
        '</select>' +
        '<button class="ghost-btn tm-page-btn" id="fdm-db-pagePrev"' + (curPage <= 1 ? ' disabled' : '') + '>←</button>' +
        '<span class="tm-page-num">Page ' + curPage + ' of ' + totalPages + '</span>' +
        '<button class="ghost-btn tm-page-btn" id="fdm-db-pageNext"' + (curPage >= totalPages ? ' disabled' : '') + '>→</button>' +
      '</div>';

    var pageSizeEl = document.getElementById('fdm-db-pageSize');
    if (pageSizeEl) pageSizeEl.addEventListener('change', function() {
      fdmDbState.pageSize = parseInt(this.value, 10);
      fdmDbState.page = 1;
      fdmDbRenderTable();
      fdmDbRenderPagination();
    });
    var prevBtn = document.getElementById('fdm-db-pagePrev');
    if (prevBtn) prevBtn.addEventListener('click', function() {
      if (fdmDbState.page > 1) { fdmDbState.page--; fdmDbRenderTable(); fdmDbRenderPagination(); }
    });
    var nextBtn = document.getElementById('fdm-db-pageNext');
    if (nextBtn) nextBtn.addEventListener('click', function() {
      var tp = fdmDbState.pageSize === 0 ? 1 : Math.ceil(fdmDbState.sorted.length / fdmDbState.pageSize);
      if (fdmDbState.page < tp) { fdmDbState.page++; fdmDbRenderTable(); fdmDbRenderPagination(); }
    });
  }

  function fdmDbFetchAll() {
    var btn = document.getElementById('fdm-db-fetchAllBtn');
    btn.disabled = true;
    btn.textContent = 'Syncing…';
    document.getElementById('fdm-db-lastUpdated').textContent = 'Syncing…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = 'Fetch for all clients';
        var errCount = (result.errors || []).length;
        var syncedCount = (result.synced || []).length;
        if (errCount) {
          document.getElementById('fdm-db-lastUpdated').textContent = 'Done (some errors)';
          showError(result.errors.map(function(e) { return e.clientName + ': ' + e.message; }).join('; '));
        } else {
          document.getElementById('fdm-db-lastUpdated').textContent = result.lastSyncedAt
            ? new Date(result.lastSyncedAt).toLocaleString()
            : '—';
        }
        fdmDbLoad();
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'Fetch for all clients';
        document.getElementById('fdm-db-lastUpdated').textContent = 'Error';
        showError(err);
      })
      .WD_syncFrameworkMappingDBAllClients();
  }

  document.getElementById('fdm-db-fetchAllBtn').addEventListener('click', fdmDbFetchAll);

  var fdmDbFwFilter = document.getElementById('fdm-db-frameworkFilter');
  if (fdmDbFwFilter) fdmDbFwFilter.addEventListener('change', fdmDbApplyFilter);

  // ── End Control Mapping ──────────────────────────────────────────────────────

</script>
