<style>
  :root{
    --bg: #f4f1fb;
    --panel: #ffffff;
    --panel-2: #f7f4ff;
    --border: #e4dcfa;
    --text: #241f35;
    --muted: #6d6489;
    --primary: #7356d8;
    --primary-2: #907ae7;
    --accent: #4b2a1f;
    --success: #19795c;
    --danger: #b54747;
    --shadow: 0 14px 40px rgba(53, 33, 110, 0.08);
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Inter, Arial, sans-serif;
    background: linear-gradient(180deg, #f7f4fd 0%, #f1eef9 100%);
    color: var(--text);
  }

  .app-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 228px 1fr;
  }

  .sidebar {
    background: linear-gradient(180deg, #2f1837 0%, #211026 100%);
    color: #fff;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-right: 1px solid rgba(255,255,255,0.07);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 14px;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #7f66e8, #a795f2);
    font-size: 15px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .brand-name {
    font-size: 17px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .brand-sub {
    margin-top: 2px;
    color: rgba(255,255,255,0.48);
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  .nav-section-label {
    padding: 10px 8px 4px;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: rgba(255,255,255,0.65);
    text-align: left;
    padding: 9px 10px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: 0.15s ease;
    letter-spacing: 0.1px;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.9);
  }

  .nav-item.active {
    background: rgba(144,122,231,0.18);
    color: #fff;
    font-weight: 600;
    box-shadow: inset 3px 0 0 rgba(167,149,242,0.75);
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 8px 4px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .small-label {
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .sidebar-note {
    margin-top: 6px;
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    line-height: 1.5;
  }

  .workspace {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }

.module-pane {
    display: none;
  }

  .module-pane.active {
    display: block;
  }

  .hero-card,
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow);
  }

  .hero-card {
    padding: 28px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hero-title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .hero-copy {
    margin-top: 10px;
    max-width: 720px;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.6;
  }

  .panel {
    padding: 16px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .panel-head.tight {
    margin-bottom: 8px;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1px;
  }

  .panel-head h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
  }

  .panel-head p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .info-banner {
    background: #f1ecff;
    color: #5d4d94;
    border: 1px solid #ded2fd;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
    line-height: 1.5;
    font-size: 12px;
  }

  .grid {
    display: grid;
    gap: 12px;
  }

  .grid-2 {
    grid-template-columns: 1fr 1fr;
  }

  .grid-3 {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--muted);
  }

  .field input,
  .field select,
  .output-textarea {
    width: 100%;
    border: 1px solid #d6cfeb;
    background: #fff;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: 0.18s ease;
  }

  .field input:focus,
  .field select:focus,
  .output-textarea:focus {
    border-color: var(--primary-2);
    box-shadow: 0 0 0 3px rgba(144,122,231,0.14);
  }

  .inline-toggle-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }

  .toggle-wrap {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
  }

  .toggle-wrap input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #d8d8df;
    border-radius: 999px;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .toggle-slider:before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: 0.18s ease;
  }

  .toggle-wrap input:checked + .toggle-slider {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
  }

  .toggle-wrap input:checked + .toggle-slider:before {
    transform: translateX(18px);
  }

  .toggle-title {
    font-size: 12px;
    font-weight: 700;
  }

  .toggle-help {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
  }

  .button-row {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .primary-btn,
  .secondary-btn,
  .ghost-btn {
    border: 0;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.18s ease;
    font-family: inherit;
  }

  .primary-btn {
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 12px 24px rgba(115,86,216,0.24);
  }

  .secondary-btn {
    color: #fff;
    background: #4b7bec;
  }

  .ghost-btn {
    background: #f3efff;
    color: #5e4d97;
    border: 1px solid #ded4fb;
  }

  .primary-btn:hover,
  .secondary-btn:hover,
  .ghost-btn:hover {
    transform: translateY(-1px);
  }

  .split-output {
    margin-top: 20px;
    align-items: start;
  }

  .results-meta {
    margin-bottom: 10px;
    font-size: 12px;
  }

  .muted {
    color: var(--muted);
  }

  .table-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  table.results-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 780px;
  }

  table.results-table th,
  table.results-table td {
    padding: 5px 10px;
    border-bottom: 1px solid #ece7fb;
    vertical-align: top;
    font-size: 12px;
    text-align: left;
  }

  table.results-table th {
    background: #faf8ff;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6c5f95;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
  }

  .pill.outstanding {
    color: #8b4b0f;
    background: #fff1df;
  }

  .pill.ok {
    color: var(--success);
    background: #e9fbf4;
  }

  .pill.doc-type {
    color: #3b5fa0;
    background: #e8eeff;
  }

  .output-textarea {
    min-height: 260px;
    resize: vertical;
    line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
  }

  .formatted-preview {
    margin-top: 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    background: #fcfbff;
    line-height: 1.55;
    font-size: 12px;
  }

  .formatted-preview ol {
    padding-left: 20px;
  }

  .formatted-preview ul {
    margin-top: 8px;
  }

  .empty-state {
    color: var(--muted);
    padding: 24px 0;
  }

  .loading {
    opacity: 0.7;
    pointer-events: none;
  }

  /* ── Framework Multi-Select ───────────────────────────────────────────────── */

  .ms-wrap {
    position: relative;
  }

  .ms-trigger {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #d6cfeb;
    background: #fff;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: 0.18s ease;
    color: var(--text);
  }

  .ms-trigger:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .ms-trigger:not(:disabled):hover,
  .ms-trigger:not(:disabled):focus {
    border-color: var(--primary-2);
    box-shadow: 0 0 0 4px rgba(144,122,231,0.14);
    outline: none;
  }

  .ms-trigger.open {
    border-color: var(--primary-2);
    box-shadow: 0 0 0 4px rgba(144,122,231,0.14);
  }

  .ms-caret {
    font-size: 11px;
    color: var(--muted);
    margin-left: 8px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }

  .ms-trigger.open .ms-caret {
    transform: rotate(180deg);
  }

  .ms-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(53,33,110,0.12);
    z-index: 100;
    overflow: hidden;
  }

  .ms-dropdown.open {
    display: block;
  }

  .ms-options {
    max-height: 220px;
    overflow-y: auto;
    padding: 6px;
  }

  .ms-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    transition: 0.12s ease;
  }

  .ms-option:hover {
    background: var(--panel-2);
  }

  .ms-option input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--primary);
    flex-shrink: 0;
    cursor: pointer;
  }

  .ms-option-label {
    line-height: 1.3;
  }

  .ms-empty {
    padding: 12px 10px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── End Framework Multi-Select ────────────────────────────────────────────── */

  /* ── Framework Explorer ───────────────────────────────────────────────────── */

  .fx-panels {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
    align-items: start;
  }

  .fx-col {
    min-height: 360px;
    display: flex;
    flex-direction: column;
    padding: 14px;
  }

  .fx-list {
    flex: 1;
    overflow-y: auto;
    max-height: 480px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .fx-item {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.4;
    border: 1px solid transparent;
    transition: 0.15s ease;
    user-select: none;
  }

  .fx-item:hover {
    background: var(--panel-2);
    border-color: var(--border);
  }

  .fx-item.active {
    background: linear-gradient(135deg, rgba(144,122,231,0.14), rgba(115,86,216,0.22));
    border-color: rgba(115,86,216,0.3);
    color: var(--primary);
    font-weight: 600;
  }

  .fx-item-name {
    font-weight: 600;
  }

  .fx-item-desc {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
  }

  .fx-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .fx-section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 8px 12px 4px;
  }

  .fx-detail-item {
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    margin-bottom: 4px;
  }

  .fx-detail-item a {
    color: var(--primary);
    text-decoration: none;
  }

  .fx-detail-item a:hover {
    text-decoration: underline;
  }

  .fx-status {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 8px;
    margin-top: 3px;
    background: #f0edff;
    color: #5e4d97;
  }

  /* ── End Framework Explorer ────────────────────────────────────────────────── */

  /* ── Drive Utility ───────────────────────────────────────────────────────── */

  .du-grid {
    display: grid;
    grid-template-columns: 0.85fr 1.15fr;
    gap: 12px;
    align-items: start;
  }

  .du-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .du-card-h {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }

  .du-card-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.2px; }

  .du-card-b { padding: 12px 14px; }

  .du-badge {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    white-space: nowrap;
  }

  .du-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

  .du-tabBtn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .du-tabBtn:hover:not(.active) { background: #ece8fb; color: var(--text); }

  .du-tabBtn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff;
    border-color: transparent;
  }

  .du-split { display: grid; gap: 10px; }

  .du-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .du-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 5px;
  }

  .du-hint { font-size: 11px; opacity: 0.75; }

  .du-card input,
  .du-card select,
  .du-card textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text);
    outline: none;
    transition: 0.15s ease;
    font-family: inherit;
  }

  .du-card textarea { resize: vertical; min-height: 64px; max-height: 140px; }

  .du-card input:focus,
  .du-card select:focus,
  .du-card textarea:focus {
    border-color: var(--primary-2);
    box-shadow: 0 0 0 3px rgba(144,122,231,0.14);
  }

  .du-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .du-check {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    padding: 5px 8px;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .du-check input[type="checkbox"] {
    width: 14px; height: 14px; margin: 0; padding: 0;
    border: none; box-shadow: none; flex-shrink: 0;
    accent-color: var(--primary);
  }

  .du-check input[type="checkbox"]:focus { box-shadow: none; border: none; }

  .du-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .du-btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    transition: 0.15s ease;
  }

  .du-btn:hover { background: #ece8fb; }

  .du-btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(115,86,216,0.22);
  }

  .du-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(115,86,216,0.30); }
  .du-btn-ghost { background: transparent; }
  .du-btn-ghost:hover { background: var(--panel-2); }

  .du-status {
    margin-top: 12px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .du-status.good { border-color: rgba(25,121,92,0.40); }
  .du-status.bad  { border-color: rgba(181,71,71,0.40); }

  #du-output {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    line-height: 1.45;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 220px;
    max-height: 520px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    display: block;
  }

  .du-mini { font-size: 11px; color: var(--muted); margin-top: 8px; }

  @media (max-width: 900px) { .du-grid { grid-template-columns: 1fr; } }
  @media (max-width: 680px) { .du-row { grid-template-columns: 1fr; } }

  /* ── End Drive Utility ───────────────────────────────────────────────────── */

  /* ── Test Monitoring ────────────────────────────────────────────────────── */

  .tm-header-panel {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .tm-header-left h2 { margin: 0; font-size: 14px; font-weight: 700; }
  .tm-header-left p  { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .tm-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .tm-last-refresh-label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Stat cards row */
  .tm-stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .tm-stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    border-left: 4px solid var(--border);
    box-shadow: var(--shadow);
  }

  .tm-stat-val {
    font-size: 28px;
